<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bộ Quay Flycam 360 Căn Cứ Chiến Lược</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
    #view { width: 100%; height: 100%; display: block; }
    #status-overlay {
      position: fixed; top: 16px; left: 16px; z-index: 1000;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #38bdf8;
      padding: 12px 18px; color: #f8fafc; font-size: 13px; border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6); min-width: 320px;
    }
    #status-overlay h3 { margin: 0 0 6px; color: #38bdf8; font-size: 14px; letter-spacing: 1px; }
    .bar { width: 100%; height: 6px; background: rgba(255,255,255,0.15); margin-top: 8px; border-radius: 3px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.1s linear; }
  </style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status-overlay">
  <h3 id="ui-title">DRONE FLYCAM 360</h3>
  <div id="ui-status">Đang khởi tạo Three.js...</div>
  <div class="bar"><div id="ui-fill" class="fill"></div></div>
</div>

<script src="../three.min.js"></script>
<script src="../three-mesh-bvh.js"></script>
<script src="../src/core/sky.js"></script>
<script src="../src/core/weather.js"></script>
<script src="../src/core/map_gen.js"></script>
<script src="../src/core/ground_shader.js"></script>
<script src="../src/gameplay/destructibles.js"></script>
<script src="../src/gameplay/props.js"></script>
<script src="../src/gameplay/streetscape.js"></script>
<script src="../src/gameplay/strongholds.js"></script>
<!-- Nạp đầy đủ các module căn cứ quân sự chiến lược (loại bỏ tank_models để không sinh xe tăng đỗ) -->
<script src="../src/gameplay/landmarks.js"></script>
<script src="../src/gameplay/landmarks/bio.js"></script>
<script src="../src/gameplay/landmarks/sam.js"></script>
<script src="../src/gameplay/landmarks/power.js"></script>
<script src="../src/gameplay/landmarks/radar.js"></script>
<script src="../src/core/backdrop.js"></script>
<script src="../src/core/terrain.js"></script>

<script>
(function() {
  const q = new URLSearchParams(location.search);
  const MAP_TYPE = (q.get('map') || 'URBAN').toUpperCase();
  const SEED = (parseInt(q.get('seed'), 10) || 20261024) >>> 0;
  // Tốc độ quay chậm rãi, thư thái: 24.0 giây cho 1 vòng 360 độ (mỗi giây chỉ quay 15 độ)
  const RECORD_DUR = Math.max(16, parseFloat(q.get('dur') || 32.0));
  // 60 FPS để chuyển động quay tròn mượt mà tuyệt đối, không bị khựng judder
  const FPS = 60;
  const IS_AUTO = q.get('auto') === '1';

  // Bắt buộc bật bố cục STRONGHOLDS để dựng căn cứ chiến lược và cứ điểm
  if (typeof MapGen !== 'undefined') {
    MapGen.setLayout('STRONGHOLDS');
    const customLm = q.get('landmark');
    if (customLm && MapGen.setLandmark) MapGen.setLandmark(customLm);
  }

  // BỎ TOÀN BỘ XE TĂNG TĨNH ĐỖ LINH TINH TRONG CĂN CỨ
  if (typeof Landmarks !== 'undefined' && Landmarks.LandmarkSet) {
    Landmarks.LandmarkSet.prototype.placeVehicle = function() {
      // Hoàn toàn không sinh xe tăng vào căn cứ
      return;
    };
  }
  window.TankModelBuilder = undefined;

  document.getElementById('ui-title').textContent = `FLYCAM 360 · ${MAP_TYPE}`;
  const statusEl = document.getElementById('ui-status');
  const fillEl = document.getElementById('ui-fill');

  function setStatus(text, prog = null) {
    if (statusEl) statusEl.textContent = text;
    if (prog !== null && fillEl) fillEl.style.width = Math.min(100, Math.max(0, prog * 100)) + '%';
  }

  // 1. Khởi tạo Three.js tối ưu hiệu năng cao để đảm bảo luôn đạt 60 FPS mượt mà
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: true
  });
  renderer.setSize(960, 540);
  renderer.setPixelRatio(1.0);
  // Tắt shadow map nặng nề: góc nhìn Flycam trên cao 220m nhìn xuống không cần bóng đổ đa giác nặng,
  // giúp GPU luôn chạy 60 FPS ổn định, loại bỏ 100% tình trạng giật khung hình!
  renderer.shadowMap.enabled = false;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);

  const camera = new THREE.PerspectiveCamera(45, 960 / 540, 2, 9000);

  // Hệ thống chiếu sáng chiến trường nổi bật công trình 3D
  const sunLight = new THREE.DirectionalLight(0xfff7e8, 1.45);
  sunLight.position.set(400, 700, 300);
  scene.add(sunLight);

  const hemiLight = new THREE.HemisphereLight(0xe8f2ff, 0x443a2c, 0.75);
  scene.add(hemiLight);
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
  scene.add(ambientLight);

  setStatus('Đang dựng địa hình & căn cứ chiến lược...');

  // 2. Dựng BattleTerrain3D với đầy đủ công trình căn cứ chiến lược
  const terrain = new BattleTerrain3D(scene, MapGen.SIZE, MapGen.SIZE, MAP_TYPE, SEED);

  if (terrain && terrain.atmosphere && typeof SkySystem !== 'undefined') {
    SkySystem.applyLights(scene, sunLight, hemiLight, ambientLight, terrain.atmosphere);
  }

  // 3. Xác định tâm quay chính xác của CĂN CỨ CHIẾN LƯỢC
  const landmark = terrain.map && terrain.map.landmarks && terrain.map.landmarks[0];
  let center = { x: 0, z: 0 };
  let baseName = 'CĂN CỨ TRUNG TÂM';

  if (landmark) {
    center = { x: landmark.x, z: landmark.z };
    baseName = landmark.name || landmark.kind || 'CĂN CỨ CHIẾN LƯỢC';
    console.log('[RECORDER] Đã tìm thấy căn cứ:', landmark.kind, 'tại tọa độ', center);
  } else {
    const shList = (terrain.map && terrain.map.strongholds) || [];
    const shB = shList.find(s => s.id === 'B') || shList[0] || { x: 0, z: 0 };
    center = { x: shB.x, z: shB.z };
  }

  document.getElementById('ui-title').textContent = `FLYCAM 360 · ${baseName.toUpperCase()}`;

  const elev = terrain.getElevationAt(center.x, center.z);
  // Bán kính & độ cao camera bao trọn toàn bộ cụm công trình căn cứ
  const R = 860;
  const H = 420;
  const lookTarget = new THREE.Vector3(center.x, elev + 20, center.z);

  function updateCam(rotT) {
    const angle = rotT * Math.PI * 2 - Math.PI * 0.5;
    const cx = center.x + Math.cos(angle) * R;
    const cz = center.z + Math.sin(angle) * R;
    const cy = elev + H + Math.sin(angle * 2) * 12;

    camera.position.set(cx, cy, cz);
    camera.lookAt(lookTarget);
    sunLight.target.position.set(center.x, elev, center.z);
  }

  // 4. Tiến trình ghi hình bằng MediaRecorder ở 60 FPS
  let state = 'WARMUP';
  let timer = 0;
  const WARMUP_TIME = 2.0; // Làm nóng 2.0s để GPU nạp xong shader và ổn định tốc độ
  let recorder = null;
  let chunks = [];

  function startRecord() {
    // 60 FPS capture
    const stream = canvas.captureStream(FPS);
    let mime = 'video/webm';
    if (MediaRecorder.isTypeSupported('video/webm; codecs=vp9')) {
      mime = 'video/webm; codecs=vp9';
    } else if (MediaRecorder.isTypeSupported('video/webm; codecs=vp8')) {
      mime = 'video/webm; codecs=vp8';
    }

    chunks = [];
    try {
      recorder = new MediaRecorder(stream, {
        mimeType: mime,
        videoBitsPerSecond: 1050000 // 1.05 Mbps cho 45s nhẹ ~5.8 MB, nạp nhanh
      });
    } catch (e) {
      recorder = new MediaRecorder(stream);
    }

    recorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };

    recorder.onstop = saveVideo;
    recorder.start(100);
  }

  function saveVideo() {
    setStatus('Đang tải video lên máy chủ...', 1.0);
    const blob = new Blob(chunks, { type: 'video/webm' });
    const fileName = `recon_${MAP_TYPE.toLowerCase()}.webm`;

    fetch('/api/save-video', {
      method: 'POST',
      headers: {
        'x-file-name': fileName,
        'Content-Type': 'application/octet-stream'
      },
      body: blob
    }).then(res => res.json())
      .then(() => {
        setStatus(`✓ ĐÃ XUẤT THÀNH CÔNG: ${fileName} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`, 1.0);
        window.__RECON_DONE__ = true;

        if (MAP_TYPE === 'URBAN') {
          fetch('/api/save-video', {
            method: 'POST',
            headers: { 'x-file-name': 'recon_briefing.webm' },
            body: blob
          });
        }

        if (IS_AUTO) {
          setTimeout(() => { window.close(); }, 800);
        }
      }).catch(err => {
        setStatus('Lỗi lưu: ' + err.message);
      });
  }

  // Khởi động trước 1 khung hình
  updateCam(0);
  renderer.render(scene, camera);

  let lastTime = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (state === 'WARMUP') {
      timer += dt;
      updateCam(0);
      setStatus('Đang ổn định khung hình 60 FPS...', timer / WARMUP_TIME);
      if (timer >= WARMUP_TIME) {
        timer = 0;
        state = 'RECORDING';
        startRecord();
      }
    } else if (state === 'RECORDING') {
      timer += dt;
      const rotT = timer / RECORD_DUR;
      updateCam(rotT);
      setStatus(`Đang quay Flycam 60 FPS... (${timer.toFixed(1)}s / ${RECORD_DUR.toFixed(1)}s)`, rotT);

      if (timer >= RECORD_DUR) {
        state = 'DONE';
        if (recorder && recorder.state !== 'inactive') recorder.stop();
      }
    } else {
      updateCam(0);
    }

    renderer.render(scene, camera);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
