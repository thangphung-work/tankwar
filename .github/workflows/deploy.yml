name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Triển khai lên Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Triển khai mã nguồn qua SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            echo "==> Cập nhật mã nguồn mới nhất từ nhánh main..."
            cd /opt/tankwar
            git fetch origin main
            git reset --hard origin/main

            echo "==> Cài đặt các gói phụ thuộc..."
            npm ci || npm install

            echo "==> Xây dựng bản phát hành (build dist)..."
            npm run build

            echo "==> Cập nhật quyền sở hữu thư mục ứng dụng..."
            chown -R tankwar:tankwar /opt/tankwar

            echo "==> Khởi động lại dịch vụ tankwar..."
            systemctl restart tankwar

            echo "==> Kiểm tra trạng thái dịch vụ..."
            systemctl is-active --quiet tankwar
            echo "==> Hoàn tất triển khai thành công!"
