<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Render ảnh trang bị</title>
<!--
  TRANG RENDER ẢNH TRANG BỊ (chạy 1 lần khi đổi mô hình / thêm món):
  dựng mô hình 3D thật của từng món bằng chính vật liệu trong game (sơn xe, thép, cảm biến, lá ngụy trang,
  mô hình đạn ProjectileModels), chụp nền trong suốt góc 3/4 có đèn key + rim + bóng đổ, xuất WebP 512 px (dựng 1024 rồi thu nhỏ cho mịn).
  Mở trang trong trình duyệt -> bấm "Tải tất cả" để lưu từng ảnh, hoặc chạy headless rồi tách các <img data-id>
  (dump-dom) ra assets/equipment/<id>.webp. Dải chọn trang bị (src/ui/armory_ui.js) đọc ảnh từ thư mục đó.
-->
<style>
  body { margin: 0; background: #11150f; color: #d8dccf; font: 13px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 10px; padding: 12px; }
  #grid figure { margin: 0; background: #1a2019; border: 1px solid #2d352a; text-align: center; padding: 6px; }
  #grid img { width: 128px; height: 128px; display: block; margin: 0 auto 4px; }
  #bar { padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  button { font: 600 12px system-ui; padding: 6px 10px; }
</style>
</head>
<body>
<div id="bar"><span id="status">Đang dựng…</span><button id="dl" disabled>Tải tất cả</button></div>
<div id="grid"></div>
<script src="three.min.js?v=20261019i"></script>
<script src="src/core/sky.js?v=20261020tone1"></script>
<script src="src/core/equipment.js?v=20261026det2"></script>
<script src="src/entities/projectiles.js?v=20261023msl2"></script>
<script src="src/entities/tanks/vehicle_kit.js?v=20261021lamp2"></script>
<script src="src/entities/tanks/roof_mounts.js?v=20261026det1"></script>
<script src="src/entities/tanks/fsv_hailstorm.js?v=20261026det2"></script>
<script src="src/entities/recon_drone.js"></script>
<script src="src/gameplay/kamikaze_uav.js?v=20261026det2"></script>
<script>
(function () {
  const OUT = 512, RS = 1024;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(RS, RS);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.LinearEncoding;
  if (window.SkySystem && SkySystem.installToneCurve) SkySystem.installToneCurve(renderer, 1.1);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xe2ecf6, 0x3a3226, 0.06));
  // Môi trường phản chiếu (IBL) kiểu phòng chụp: trời sáng phía trên, đất nâu tối phía dưới, 1 hộp đèn mềm lớn (key),
  // 1 dải đèn viền dài, 1 tấm hắt phụ. Thiếu nó thì kim loại không có gì để phản chiếu, sơn không có ánh Fresnel ở mép
  // -> mọi mặt nhẵn đều đặn như nhựa
  function studioEnv() {
    // ảnh toàn cảnh 2:1 (equirect): u = phương vị, v = độ cao; giá trị trong [0, 1] nên độ sáng kiểm soát được
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const x = c.getContext('2d');
    const gr = x.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#b9c2cc'); gr.addColorStop(0.46, '#8c8880'); gr.addColorStop(0.54, '#5a5248'); gr.addColorStop(1, '#2a241e');
    x.fillStyle = gr; x.fillRect(0, 0, 512, 256);
    const soft = (cx, cy, w, h, a) => { x.filter = 'blur(6px)'; x.fillStyle = `rgba(255,250,240,${a})`; x.fillRect(cx - w / 2, cy - h / 2, w, h); x.filter = 'none'; };
    soft(150, 60, 90, 60, 1.0);    // hộp đèn key: trái - trên - trước
    soft(400, 95, 150, 14, 0.9);   // dải đèn viền phía sau
    soft(300, 115, 60, 40, 0.35);  // tấm hắt phụ
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;
    const pm = new THREE.PMREMGenerator(renderer);
    const out = pm.fromEquirectangular(t).texture;
    pm.dispose();
    return out;
  }
  if (!/noenv/.test(location.search)) scene.environment = studioEnv();
  const key = new THREE.DirectionalLight(0xfff3e0, 1.35);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0004;
  scene.add(key, key.target);
  const rim = new THREE.DirectionalLight(0xbfdcff, 0.7);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.22);
  scene.add(fill);
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 2000);
  // mặt hứng bóng (chỉ vẽ bóng, nền vẫn trong suốt)
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.32 }));
  catcher.rotation.x = -Math.PI / 2;
  catcher.receiveShadow = true;
  scene.add(catcher);

  const K = VehicleKit, EQ = Equipment;
  const VM = K.createMaterials('BLUE');
  const KM = EQ.kitMats('BLUE');
  const std = (c, r, m, extra) => Object.assign(new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m }), extra || {});
  const MAT = {
    olive: std(0x5a5c50, 0.62, 0.3), oliveDark: std(0x46483e, 0.66, 0.3), steel: std(0x8e9194, 0.32, 0.85),
    black: std(0x1b1c1d, 0.6, 0.3), brass: std(0xd2ab55, 0.3, 0.6), brassD: std(0x9c7a35, 0.38, 0.6),
    red: std(0x9a1d16, 0.5, 0.1), redPaint: std(0x8a1d15, 0.5, 0.2), copper: std(0x4e4037, 0.78, 0.5),
    tung: std(0x7d8389, 0.35, 0.85), amber: std(0xc4862f, 0.45, 0.1), sabot: std(0x5c6247, 0.5, 0.4),
    yellow: std(0x8f7330, 0.62, 0.1), white: std(0xb9b4a4, 0.6, 0.1), alu: std(0x80827e, 0.55, 0.7),
    fabric: std(0x8c7d4a, 0.95, 0), iron: std(0x5a5650, 0.55, 0.6), hei: std(0xd39a14, 0.62, 0.05), bandCu: std(0x8f4a26, 0.38, 0.75)
  };
  if (VM.canvas && VM.canvas.map) MAT.fabric.map = VM.canvas.map;
  // phản chiếu bầu trời cho kim loại (cùng envMap với thép xe, nếu có)
  const ENV = (VM.steel && VM.steel.envMap) || null;
  // vật liệu riêng của trang này phản chiếu phòng chụp (scene.environment), không dùng hộp trời của game

  const lathe = (pts, seg = 28) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(Math.max(0.001, p[0]), p[1])), seg);
  const meshOf = (geo, mat, pos, rot, sc) => {
    const m = new THREE.Mesh(geo, mat);
    if (pos) m.position.set(pos[0], pos[1], pos[2]);
    if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    if (sc) m.scale.set(sc[0], sc[1], sc[2]);
    m.castShadow = m.receiveShadow = true;
    return m;
  };
  function stripTracers(g) {
    const kill = [];
    g.traverse(o => { if (o.userData && o.userData.tracer) kill.push(o); });
    kill.forEach(o => o.parent.remove(o));
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    return g;
  }

  // ===================== ĐẠN =====================
  // Dựng theo kích thước thật (mm) rồi thu về AMMO_LEN đơn vị: vỏ đồng thau có gờ đáy, rãnh móc vỏ, hạt nổ; đầu đạn có đai
  // dẫn đồng xẻ rãnh, mũi ogive tiếp tuyến, ngòi nổ riêng; sơn có vạch màu + chữ in khuôn theo quy ước NATO
  // (vàng = thuốc nổ, đỏ = chất cháy, đen = xuyên giáp, xanh lam = cháy 12.7)
  const AMMO_LEN = 10;
  const V2 = p => new THREE.Vector2(Math.max(0.001, p[0]), p[1]);
  const rev = (pts, mat, seg = 44) => meshOf(new THREE.LatheGeometry(pts.map(V2), seg), mat);
  // ogive tiếp tuyến bán kính R dài L bắt đầu ở y0, cắt ở bán kính rTip (mặt ngòi / mặt mũi)
  function ogive(R, L, y0, rTip = 0, n = 16) {
    const rho = (R * R + L * L) / (2 * R), rOf = x => Math.sqrt(rho * rho - x * x) + R - rho, pts = [];
    for (let i = 1; i <= n; i++) {
      const x = L * i / n, r = rOf(x);
      if (r <= rTip) {
        const xp = L * (i - 1) / n, rp = rOf(xp);
        pts.push([rTip, y0 + xp + (x - xp) * (rp - rTip) / (rp - r)]);
        return pts;
      }
      pts.push([r, y0 + x]);
    }
    return pts;
  }
  const rAt = (P, y) => {
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1];
      if (y >= a[1] && y <= b[1]) return b[1] === a[1] ? Math.max(a[0], b[0]) : a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]);
    }
    return 0;
  };
  // dải sơn / vành bám theo biên dạng P từ y0 tới y1 (phồng nhẹ để khỏi chập mặt)
  const band = (P, y0, y1, mat, k = 1.006) => {
    const pts = [];
    for (let i = 0; i <= 10; i++) { const y = y0 + (y1 - y0) * i / 10; pts.push([rAt(P, y) * k, y]); }
    return rev(pts, mat);
  };
  // khe tách guốc đạn: dải mảnh màu tối chạy dọc biên dạng ở góc phi
  const seam = (P, y0, y1, phi, mat) => {
    const pts = [];
    for (let i = 0; i <= 12; i++) { const y = y0 + (y1 - y0) * i / 12; pts.push([rAt(P, y) * 1.008, y]); }
    return meshOf(new THREE.LatheGeometry(pts.map(V2), 1, phi, 0.035), mat);
  };
  const ring = (r, y, h, mat) => meshOf(new THREE.CylinderGeometry(r, r, h, 44), mat, [0, y + h / 2, 0]);
  const tipOf = P => P[P.length - 1][1];

  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  // vân bề mặt nhân vào màu gốc: lốm đốm sơn / ôxi hoá nhẹ + vài vết xước sáng (mặt nhẵn đồng màu là thứ làm vật trông như nhựa)
  const GRIME = canvasTex(256, 256, (x, w, h) => {
    let s = 9;
    const R = () => (s = s * 16807 % 2147483647) / 2147483647;
    x.fillStyle = '#f4f4f4'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 1100; i++) {
      const v = 205 + R() * 50 | 0;
      x.fillStyle = `rgba(${v},${v},${v},0.33)`;
      x.beginPath(); x.arc(R() * w, R() * h, 0.8 + R() * 6, 0, 7); x.fill();
    }
    x.strokeStyle = 'rgba(255,255,255,0.55)'; x.lineWidth = 0.7;
    for (let i = 0; i < 50; i++) { const px = R() * w, py = R() * h; x.beginPath(); x.moveTo(px, py); x.lineTo(px + (R() - 0.5) * 34, py + (R() - 0.5) * 6); x.stroke(); }
  });
  GRIME.wrapS = GRIME.wrapT = THREE.RepeatWrapping;
  // vật liệu chung (động cơ, phụ kiện) cũng có vân bề mặt thay cho màu phẳng như nhựa
  for (const k in MAT) {
    const m = MAT[k];
    if (!m.map) m.map = GRIME;
    m.roughnessMap = GRIME; m.bumpMap = GRIME; m.bumpScale = 0.012;
    m.envMapIntensity = m.metalness > 0.3 ? 2.0 : 1.0;
    m.needsUpdate = true;
  }
  const am = (c, r, m, o) => {
    // roughnessMap: chỗ bẩn / xước nhám khác chỗ sạch; bumpMap: lỗ rỗ, gợn sơn -> ánh phản chiếu vỡ vụn như vật thật
    const x = std(c, r, m, Object.assign({ map: GRIME, roughnessMap: GRIME, bumpMap: GRIME, bumpScale: m > 0.3 ? 0.006 : 0.014 }, o || {}));
    x.envMapIntensity = m > 0.3 ? 2.2 : 1.1;   // kim loại cần thấy rõ hộp đèn phản chiếu, nếu không đồng thau xỉn như sơn
    return x;
  };
  const AM = {
    brass: am(0xdcb25a, 0.28, 0.85), brassD: am(0xa8853f, 0.4, 0.75), primer: am(0xb58d55, 0.28, 0.85),
    gild: am(0xb9724a, 0.3, 0.85), copper: am(0xa55c36, 0.36, 0.85),
    steel: am(0x8e9298, 0.36, 0.85), steelD: am(0x4b4f53, 0.48, 0.75), alu: am(0xb8bcc0, 0.38, 0.75),
    tung: am(0xa6acb2, 0.3, 0.92), du: am(0x1c1e1f, 0.62, 0.45), sabotAl: am(0x9ba1a7, 0.38, 0.85), gun: am(0x3c3f42, 0.42, 0.8),
    olive: am(0x434a2d, 0.64, 0.12), oliveD: am(0x31351f, 0.68, 0.1), black: am(0x1f2021, 0.58, 0.15),
    grey: am(0x55595c, 0.55, 0.3), yellow: am(0xcf9a1c, 0.6, 0.05), red: am(0x9c2018, 0.55, 0.05),
    blue: am(0x2c5a98, 0.55, 0.05), green: am(0x3d6a2b, 0.55, 0.05), silver: am(0xaeb3b8, 0.4, 0.6),
    tan: am(0x7e6c47, 0.9, 0), sabot: am(0x3b3f43, 0.4, 0.7), nylon: am(0x8c8676, 0.62, 0), kraft: am(0x8c6c44, 0.9, 0), rubber: am(0x161718, 0.85, 0), amber: am(0xc27c22, 0.42, 0.05)
  };
  // chữ in khuôn quanh thân (ống mỏng trong suốt), chữ nằm ở mặt hướng máy ảnh: u = 0.5 -> +z
  function stencil(r, y0, y1, lines, color = '#e2c14a') {
    const tex = canvasTex(1024, 256, (x, w, h) => {
      x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
      const fs = h * 0.86 / lines.length;
      x.font = `700 ${fs}px "Arial Narrow", "Roboto Condensed", Arial, sans-serif`;
      lines.forEach((t, i) => x.fillText(t, w / 2, h * 0.07 + fs * (i + 0.5), w * 0.22));
    });
    const m = new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.7, metalness: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    const o = meshOf(new THREE.CylinderGeometry(r * 1.008, r * 1.008, y1 - y0, 64, 1, true, Math.PI, Math.PI * 2), m, [0, (y0 + y1) / 2, 0]);
    o.castShadow = false;
    return o;
  }
  function label(r, y0, y1, arc, bg, fg, lines, face = 0) {
    const tex = canvasTex(512, 256, (x, w, h) => {
      x.fillStyle = bg; x.fillRect(0, 0, w, h);
      x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(10, 10, w - 20, h - 20);
      x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
      lines.forEach((t, i) => {
        const fs = i === 0 ? h * 0.24 : h * 0.15;
        x.font = `700 ${fs}px "Arial Narrow", Arial, sans-serif`;
        x.fillText(t, w / 2, h * (0.26 + i * 0.22), w * 0.88);
      });
    });
    const m = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, metalness: 0, polygonOffset: true, polygonOffsetFactor: -2 });
    const o = meshOf(new THREE.CylinderGeometry(r * 1.006, r * 1.006, y1 - y0, 32, 1, true, face - arc / 2, arc), m, [0, (y0 + y1) / 2, 0]);
    o.castShadow = false;
    return o;
  }
  function flatText(w, h, lines, color, bg) {
    const tex = canvasTex(256, Math.round(256 * h / w), (x, cw, ch) => {
      if (bg) { x.fillStyle = bg; x.fillRect(0, 0, cw, ch); }
      x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'middle';
      const fs = ch * 0.8 / lines.length;
      x.font = `700 ${fs}px "Arial Narrow", Arial, sans-serif`;
      lines.forEach((t, i) => x.fillText(t, cw / 2, ch * 0.1 + fs * (i + 0.5), cw * 0.94));
    });
    const m = new THREE.MeshStandardMaterial({ map: tex, transparent: !bg, roughness: 0.75, depthWrite: !!bg, polygonOffset: true, polygonOffsetFactor: -3 });
    const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    o.receiveShadow = true;
    return o;
  }
  const roundRect = (w, h, r) => {
    const sh = new THREE.Shape(), x0 = -w / 2, y0 = -h / 2;
    sh.moveTo(x0 + r, y0); sh.lineTo(x0 + w - r, y0); sh.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    sh.lineTo(x0 + w, y0 + h - r); sh.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    sh.lineTo(x0 + r, y0 + h); sh.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r); sh.lineTo(x0, y0 + r); sh.quadraticCurveTo(x0, y0, x0 + r, y0);
    return sh;
  };
  // khối vát mép (giáp ốp, vỏ hộp): UV thu nhỏ để vân sơn ngụy trang không bị lặp dày
  const bevelBlock = (w, h, t, bev, mat) => {
    const geo = new THREE.ExtrudeGeometry(roundRect(w, h, bev * 1.4), { depth: t, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 2, curveSegments: 4 });
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 0.09, uv.getY(i) * 0.09);
    return meshOf(geo, mat);
  };
  // vải dệt bọc (lót chống mảnh): sợi ngang dọc + đường chần, màu ô-liu xám
  const WEAVE = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#d9d9d2'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < w; i += 3) {
      x.fillStyle = i % 6 ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.12)';
      x.fillRect(i, 0, 1.4, h); x.fillRect(0, i, w, 1.4);
    }
    let s = 5;
    const R = () => (s = s * 16807 % 2147483647) / 2147483647;
    for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(60,55,40,${0.05 + R() * 0.08})`; x.beginPath(); x.arc(R() * w, R() * h, 2 + R() * 12, 0, 7); x.fill(); }
  });
  WEAVE.wrapS = WEAVE.wrapT = THREE.RepeatWrapping;
  // thu cả viên về AMMO_LEN, đáy ở gốc toạ độ -> đặt giữa
  function finish(g) {
    const bb = new THREE.Box3().setFromObject(g), len = bb.max.y - bb.min.y, k = AMMO_LEN / len;
    g.scale.setScalar(k);
    g.position.y = -(bb.min.y + len / 2) * k;
    const w = new THREE.Group();
    w.add(g);
    return w;
  }

  // Vỏ đạn đồng thau không gờ lồi (rimless): gờ đáy, rãnh móc vỏ, thân côn, vai, cổ; hạt nổ giữa đáy
  function brassCase(d) {
    const g = new THREE.Group();
    g.add(rev([[0, 0], [d.rim * 0.96, 0], [d.rim, d.rimH * 0.3], [d.rim, d.rimH], [d.groove, d.gy0], [d.groove, d.gy1],
      [d.body0, d.gy1 + (d.body0 - d.groove) * 1.3], [d.body1, d.ys], [d.neck, d.yn], [d.neck, d.len], [d.neck * 0.92, d.len]], AM.brass));
    g.add(ring(d.primer * 1.12, -0.25, 0.3, AM.brassD));
    g.add(ring(d.primer, -0.35, 0.3, AM.primer));
    return g;
  }
  const CASE127 = { rim: 10.2, rimH: 2, groove: 8.4, gy0: 3.6, gy1: 5.4, body0: 10.15, body1: 9.4, ys: 72, neck: 7.3, yn: 78, len: 99, primer: 3.4 };
  const CASE30 = { rim: 22.2, rimH: 3, groove: 18.6, gy0: 6, gy1: 9.5, body0: 21.8, body1: 19.8, ys: 140, neck: 16.3, yn: 151, len: 173, primer: 5.2 };

  // 12.7×99: đầu đạn áo đồng mạ đuôi vát, mũi sơn theo loại
  function round127(type) {
    const g = new THREE.Group();
    g.add(brassCase(CASE127));
    if (type === 'slap127') {
      // SLAP (M903): guốc nhựa màu hổ phách ôm kim xuyên vonfram nhô khỏi miệng guốc
      g.add(rev([[0, 80], [5.6, 80], [6.48, 84], [6.48, 108], [5.6, 112], [3.9, 113]], AM.amber));
      const K = [[3.7, 96], [3.7, 124], ...ogive(3.7, 15, 124, 0.3), [0, 139.2]];
      g.add(rev(K, AM.tung));
      return finish(g);
    }
    const P = [[0, 80], [5.3, 80], [6.48, 87], [6.48, 104], ...ogive(6.48, 34, 104, 0.6), [0, 138]];
    g.add(rev(P, AM.gild));
    g.add(band(P, 97.5, 99.2, AM.copper, 0.99));       // rãnh bóp miệng (cannelure) ngay mép cổ vỏ
    if (type === 'std') g.add(band(P, 128.5, 138, AM.black));                       // M2 AP: mũi đen
    if (type === 'inc') g.add(band(P, 127, 138, AM.blue));                          // M1 cháy: mũi xanh lam
    if (type === 'mk211') { g.add(band(P, 128, 138, AM.green)); g.add(band(P, 121.5, 126.5, AM.silver)); }   // Raufoss
    return finish(g);
  }

  // 30×173 (kiểu GAU-8 / Bushmaster II): đầu đạn thép sơn + 2 đai dẫn đồng ngay trên miệng vỏ, ngòi nổ chạm riêng
  function round30(type) {
    const g = new THREE.Group();
    g.add(brassCase(CASE30));
    const bands = () => { g.add(ring(15.9, 175, 5.2, AM.copper)); g.add(ring(15.9, 182, 5.2, AM.copper)); };
    if (type === 'apds30') {
      // APDS: guốc nhựa đen 2 nửa (rãnh tách), kim vonfram nhô ra trước, mũ chắn gió thép
      const S = [[0, 148], [13, 148], [15, 152], [15, 205], [13.6, 210], [8.2, 213], [7, 213]];
      g.add(rev(S, AM.black));
      g.add(ring(15.9, 175, 6, AM.rubber));
      for (const a of [0.2, 0.2 + Math.PI]) g.add(seam(S, 181, 213, a, AM.grey));
      g.add(rev([[6.4, 195], [6.4, 252], ...ogive(6.4, 26, 252, 0.5), [0, 279]], AM.tung));
      return finish(g);
    }
    let P, body, fuze = null, nose = null;
    if (type === 'prox30') {
      // ngòi cận đích vô tuyến: mũi ogive dài liền là chụp ăng-ten nhựa đen, vành nhôm ở gốc
      P = [[0, 148], [13.2, 148], [15, 153], [15, 218], ...ogive(15, 84, 218, 0.9), [0, 302]];
      body = AM.olive;
    } else if (type === 'ahead30') {
      // AHEAD: vỏ thép mỏng xám sẫm chứa bi vonfram, mũ mũi thép tù, ngòi thời gian ở đáy (không thấy)
      P = [[0, 148], [13.2, 148], [15, 153], [15, 226], ...ogive(15, 52, 226, 6.5), [6.5, 278], [0, 278]];
      body = AM.grey;
    } else {
      P = [[0, 148], [13.2, 148], [15, 153], [15, 222], ...ogive(15, 55, 222, 7.4), [0, tipOf(ogive(15, 55, 222, 7.4))]];
      body = type === 'inc' ? AM.yellow : AM.olive;
      // ngòi nổ chạm: chân ren, vành khía, thân côn nhôm, chỏm thép
      const y0 = P[P.length - 2][1];
      fuze = [[7.6, y0 - 1], [7.6, y0 + 4], [6.6, y0 + 13], [3.6, y0 + 19], [0, y0 + 20.5]];
      nose = y0;
    }
    g.add(rev(P, body));
    bands();
    if (type === 'std') {
      g.add(band(P, 201, 208, AM.yellow));
      g.add(stencil(15, 160, 196, ['30MM', 'HE-T'], '#e2c14a'));
    } else if (type === 'inc') {
      g.add(band(P, 205, 214, AM.red));
      g.add(stencil(15, 160, 200, ['30MM', 'HEI'], '#1d1d1d'));
    } else if (type === 'prox30') {
      g.add(band(P, 201, 208, AM.yellow));
      g.add(band(P, 246, 302, AM.black, 1.004));
      g.add(band(P, 241, 246.5, AM.alu, 1.01));
      g.add(stencil(15, 160, 196, ['30MM', 'HE PFF'], '#e2c14a'));
    } else if (type === 'ahead30') {
      g.add(band(P, 205, 211, AM.silver));
      g.add(band(P, 262, 278, AM.steel, 1.004));
      g.add(stencil(15, 160, 198, ['30MM', 'AHEAD'], '#d8d8d0'));
    }
    if (fuze) {
      g.add(rev(fuze, AM.alu));
      g.add(ring(8.1, nose + 0.2, 2.6, AM.gun));                              // vành khía vặn ngòi
      g.add(band(fuze, nose + 16.5, nose + 20.5, type === 'std' ? AM.red : AM.steel, 1.01));
    }
    return finish(g);
  }

  // Liều đạn 120mm nguyên viên: đáy thép (gờ móc, vành cao su làm kín) + vỏ cháy được bằng nitrocellulose màu vải bạt
  // ôm đầu đạn; chữ in khuôn đen trên vỏ
  function round120(type) {
    const g = new THREE.Group();
    g.add(rev([[0, 0], [80, 0], [82, 3], [82, 9], [79, 12], [79, 62], [74, 62]], AM.gun));
    g.add(ring(80.2, 50, 8, AM.rubber));
    g.add(ring(15, -0.4, 0.5, AM.primer));
    const C = [[78.6, 60], [78.6, 300], [76.5, 520], [72, 560], [63, 588], [61, 590]];
    g.add(rev(C, AM.tan));
    for (const y of [140, 470]) g.add(band(C, y, y + 5, AM.kraft, 1.004));   // đường ghép vỏ
    const tag = { AP: 'APFSDS-T M829A2', ap_du: 'APFSDS-T M829A4 DU', NORMAL: 'MP-T M1147 AMP', heat_tandem: 'HEAT-MP-T M830A1', HE: 'HE-T M908' }[type];
    g.add(stencil(78.6, 190, 330, ['CTG 120MM', tag, 'LOT 26-114'], '#1c1c1a'));
    if (type === 'AP' || type === 'ap_du') {
      // Guốc đạn (sabot) hợp kim nhôm anod sẫm, 3 cánh ôm thân mũi tên kiểu "yên ngựa": gờ định tâm sau (ngay miệng vỏ)
      // + gờ trước đủ cỡ nòng 120 có đai nylon, eo thắt ở giữa; mặt trước là phễu lõm hứng gió để tách cánh khi ra khỏi
      // nòng. 3 khe tách chạy dọc thân và xẻ qua phễu. Mũi tên vonfram / urani nghèo xuyên qua đáy phễu
      const S = [[50, 560], [60, 576], [60, 624], [53, 642], [50, 660], [50, 738], [56, 752], [60, 760], [60, 792]];
      // vonfram: guốc nhôm để trần ánh bạc, mũi tên hợp kim vonfram sáng; urani nghèo: guốc anod đen, mũi tên urani phủ
      // lớp chống ôxi hoá đen mờ + tem phóng xạ vàng trên vỏ
      const SM = type === 'ap_du' ? AM.sabot : AM.sabotAl;
      g.add(rev(S, SM));
      const scoop = rev([[13.5, 736], [17, 742], [27, 756], [39, 771], [50, 784], [57.5, 791], [60, 792]], SM.clone());
      scoop.material.side = THREE.DoubleSide;
      g.add(scoop);
      g.add(ring(60.6, 600, 10, AM.nylon));
      g.add(ring(60.6, 772, 10, AM.nylon));
      for (let i = 0; i < 3; i++) {
        const phi = 0.35 + i * Math.PI * 2 / 3;
        g.add(seam(S, 590, 792, phi, AM.black));
        const pg = new THREE.Group();
        pg.rotation.y = phi;
        pg.add(meshOf(new THREE.BoxGeometry(2.4, 2.4, 72), AM.black, [0, 765, 37], [-0.84, 0, 0]));
        g.add(pg);
      }
      const D = [[12, 700], [12, 930], ...ogive(12, 62, 930, 0.6), [0, 992]];
      g.add(rev(D, type === 'ap_du' ? AM.du : AM.tung));
      g.add(band(D, 925, 987, AM.steel, 1.01));
      if (type === 'ap_du') {
        // tem cảnh báo phóng xạ: nền vàng, biểu tượng 3 cánh quạt đen, chữ DU
        const tex = canvasTex(256, 256, (x, w, h) => {
          x.fillStyle = '#e8b81c'; x.fillRect(0, 0, w, h);
          x.strokeStyle = '#141414'; x.lineWidth = 8; x.strokeRect(8, 8, w - 16, h - 16);
          x.fillStyle = '#141414';
          const cx = w / 2, cy = h * 0.42, R1 = h * 0.07, R2 = h * 0.3;
          for (let i = 0; i < 3; i++) {
            const a = -Math.PI / 2 + i * Math.PI * 2 / 3;
            x.beginPath(); x.moveTo(cx + Math.cos(a - 0.52) * R1 * 1.5, cy + Math.sin(a - 0.52) * R1 * 1.5);
            x.arc(cx, cy, R2, a - 0.52, a + 0.52); x.arc(cx, cy, R1 * 1.5, a + 0.52, a - 0.52, true); x.fill();
          }
          x.beginPath(); x.arc(cx, cy, R1, 0, 7); x.fill();
          x.font = `900 ${h * 0.2}px Arial, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
          x.fillText('DU', cx, h * 0.84);
        });
        const m = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, polygonOffset: true, polygonOffsetFactor: -2 });
        const o = meshOf(new THREE.CylinderGeometry(78.9, 78.9, 110, 32, 1, true, -0.62, 1.24), m, [0, 445, 0]);
        o.castShadow = false;
        g.add(o);
      }
      return finish(g);
    }
    // đầu đạn cỡ đủ: vành nhựa làm kín, thân sơn, mũi ogive, ngòi
    const P = [[0, 540], [55, 540], [60, 556], [60, 760], ...ogive(60, 170, 760, type === 'heat_tandem' ? 17 : 24)];
    const top = tipOf(P);
    P.push([0, top]);
    g.add(rev(P, type === 'heat_tandem' ? AM.black : AM.oliveD));
    g.add(ring(61, 596, 12, AM.rubber));
    if (type === 'heat_tandem') {
      g.add(band(P, 690, 704, AM.yellow));
      g.add(band(P, 716, 728, AM.red));
      // cần tạo cự ly nổ (standoff) + liều mồi tandem ở đầu cần
      g.add(rev([[17, top - 2], [9, top + 18], [8, top + 140], [13, top + 150], [13, top + 176], [7, top + 186], [0, top + 188]], AM.steel));
      g.add(ring(13.3, top + 150, 14, AM.red));
    } else {
      g.add(band(P, 700, 713, AM.yellow));
      if (type === 'HE') g.add(band(P, 722, 735, AM.yellow));
      g.add(stencil(60, 618, 690, ['120MM', type === 'HE' ? 'HE-T' : 'MP-T'], '#e2c14a'));
      // ngòi: NORMAL = ngòi đa chế độ có nạp dữ liệu (mũi tù đen), HE = ngòi nổ chạm nhôm
      const F = type === 'HE'
        ? [[24, top - 2], [24, top + 14], [17, top + 40], [5, top + 58], [0, top + 59]]
        : [[24, top - 2], [24, top + 22], [21, top + 40], [14, top + 52], [0, top + 55]];
      g.add(rev(F, type === 'HE' ? AM.alu : AM.black));
      g.add(ring(25, top + 2, 6, AM.gun));
    }
    return finish(g);
  }

  // Đạn pháo 155mm (nạp rời: đầu đạn + liều phóng riêng) -> chỉ đầu đạn: đuôi vát, đai dẫn đồng rộng xẻ rãnh, gờ định tâm,
  // mũi ogive dài, ngòi vặn ren có vành khía; sơn ô-liu, vạch vàng, chữ in khuôn vàng
  function shell155(type) {
    const g = new THREE.Group();
    const P = [[0, 0], [64, 0], [70, 8], [77.5, 62], [77.5, 470], ...ogive(77.5, 262, 470, 28)];
    const top = tipOf(P);
    P.push([0, top]);
    g.add(rev(P, AM.olive));
    g.add(ring(79.6, 92, 16, AM.copper));
    g.add(ring(79.6, 112, 26, AM.copper));
    g.add(ring(76.8, 40, 3, AM.oliveD));
    g.add(band(P, 440, 462, AM.olive, 1.004));                     // gờ định tâm
    const tag = { NORMAL: ['155MM', 'HE M795', 'TNT'], HE: ['155MM', 'HE M107', 'COMP B'], CLUSTER: ['155MM', 'ICM M483A1'], he_frag: ['155MM', 'HE-FRAG M1122', 'IMX-101'] }[type];
    g.add(stencil(77.5, 240, 370, tag, '#e2c14a'));
    g.add(band(P, 500, 520, AM.yellow));
    if (type === 'HE' || type === 'he_frag') g.add(band(P, 530, 550, AM.yellow));
    if (type === 'CLUSTER') g.add(stencil(77.5, 395, 425, ['◆ ◆ ◆ ◆'], '#e2c14a'));
    if (type === 'he_frag') for (let y = 170; y <= 430; y += 36) g.add(band(P, y, y + 3, AM.oliveD, 1.003));   // rãnh tạo mảnh
    // ngòi: CLUSTER = ngòi thời gian cơ khí (vòng chia độ nhôm), còn lại = ngòi nổ chạm
    const F = type === 'CLUSTER'
      ? [[28, top - 2], [28, top + 42], [25, top + 50], [17, top + 82], [7, top + 100], [0, top + 102]]
      : [[28, top - 2], [28, top + 14], [24, top + 22], [17, top + 62], [8, top + 88], [0, top + 90]];
    g.add(rev(F, AM.steelD));
    g.add(ring(29.5, top + 6, 7, AM.gun));
    g.add(band(F, F[F.length - 3][1] - 6, tipOf(F), AM.alu, 1.008));
    if (type === 'CLUSTER') g.add(band(F, top + 18, top + 40, AM.alu, 1.01));
    return finish(g);
  }

  // PG-7V nạp sẵn: liều phóng ống giấy (kraft), động cơ hành trình có cánh gập, đầu nổ lõm ô-liu, chóp mũi nhôm + ngòi áp điện
  function rpgModel() {
    const g = new THREE.Group();
    g.add(rev([[0, 0], [20, 0], [20, 340]], AM.kraft));
    for (const y of [12, 160, 322]) g.add(ring(20.6, y, 8, AM.black));
    g.add(stencil(20, 60, 140, ['PG-7V'], '#1c1c1a'));
    g.add(rev([[20, 340], [20, 520], [24, 530]], AM.oliveD));
    // cánh ổn định gập ôm thân động cơ, vành lỗ phụt nghiêng ở đầu động cơ
    for (let i = 0; i < 6; i++) g.add(meshOf(new THREE.BoxGeometry(9, 96, 2.4), AM.steelD, [0, 394, 0], [0, i * Math.PI / 3, 0]).translateZ(21.2));
    g.add(ring(21, 492, 10, AM.black));
    const W = [[24, 530], [36, 560], [42, 600], [42, 660], [40, 680], [11, 840], [8, 848]];
    g.add(rev(W, AM.olive));
    g.add(band(W, 660, 848, AM.olive, 1.002));
    g.add(band(W, 760, 848, AM.alu, 1.006));
    g.add(ring(43, 598, 6, AM.black));
    g.add(rev([[8, 846], [6, 868], [6.5, 880], [0, 884]], AM.steel));
    return finish(g);
  }

  function ammoModel(tank, ammo, variant) {
    if (variant === 'apds30' || variant === 'ahead30') return round30(variant);
    if (variant === 'slap127' || variant === 'mk211') return round127(variant);
    if (variant) return tank === 'ARTILLERY' ? shell155(variant) : round120(variant);
    if (tank === 'SCOUT' && (ammo === 'SCOUT_BULLET' || ammo === 'INCENDIARY')) return round127(ammo === 'INCENDIARY' ? 'inc' : 'std');
    if (tank === 'GATLING') return round30(ammo === 'INCENDIARY' ? 'inc' : ammo === 'GATLING_HE' ? 'prox30' : 'std');
    if (ammo === 'RPG') return rpgModel();
    if (tank === 'ARTILLERY') return shell155(ammo);
    if (tank === 'ALL_ROUNDER') return round120(ammo);
    return stripTracers(ProjectileModels.create(ammo, { scale: 1 }));
  }

  // ===================== GIÁP & PHỤ KIỆN =====================
  // Dựng bằng PartBatch + vật liệu xe (sơn ngụy trang có mòn mép, bụi; thép; cảm biến) như phụ kiện lắp trên xe
  function batchGroup(fill, yBase = 14) {
    const g = new THREE.Group();
    const b = new K.PartBatch(yBase);
    fill(b);
    b.build(g, null, { castShadow: true });
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    return g;
  }
  const P = VM.paint, D = VM.dark, S = VM.steel;
  const MODULE_BUILD = {
    // giáp phản ứng nổ: 2 hàng × 3 hộp thép chứa tấm nổ, nắp bắt 4 bu-lông lục giác trên long-đền, đường hàn quanh nắp,
    // quai nhấc; treo trên 2 ray ngang + 4 gông đứng; số hiệu từng viên in khuôn trên nắp
    era: () => {
      const g = batchGroup(b => {
        for (const y of [-2.7, 2.7]) b.box(11.6, 0.5, 0.35, D, [0, y, -0.72]);
        for (const x of [-5.0, -1.8, 1.8, 5.0]) b.box(0.45, 7.4, 0.3, D, [x, 0, -0.95]);
        for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
          const x = -3.6 + c * 3.6, y = -1.8 + r * 3.6;
          b.box(3.4, 3.4, 1.0, P, [x, y, 0]);
          b.box(3.12, 3.12, 0.12, P, [x, y, 0.56]);
          for (const sg of [-1, 1]) {
            b.box(3.16, 0.08, 0.08, D, [x, y + sg * 1.58, 0.52]);
            b.box(0.08, 3.16, 0.08, D, [x + sg * 1.58, y, 0.52]);
          }
          for (const dx of [-1.25, 1.25]) for (const dy of [-1.25, 1.25]) {
            b.cyl(0.25, 0.25, 0.04, 14, S, [x + dx, y + dy, 0.64], 'z');
            b.cyl(0.17, 0.17, 0.16, 6, S, [x + dx, y + dy, 0.72], 'z');
          }
          b.strut([x - 0.4, y + 0.95, 0.6], [x - 0.4, y + 0.95, 0.95], 0.06, S, 6);
          b.strut([x + 0.4, y + 0.95, 0.6], [x + 0.4, y + 0.95, 0.95], 0.06, S, 6);
          b.strut([x - 0.4, y + 0.95, 0.95], [x + 0.4, y + 0.95, 0.95], 0.06, S, 6);
        }
      });
      for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
        const t = flatText(1.8, 0.5, ['ERA-4  ' + String(11 + r * 3 + c).padStart(2, '0')], '#e9e2c8');
        t.position.set(-3.6 + c * 3.6, -1.8 + r * 3.6 - 0.75, 0.625);
        g.add(t);
      }
      return g;
    },
    // giáp lồng: khung chu vi thép góc, 9 thanh lá dẹt đặt đứng cạnh (mỏng theo phương đạn tới để kẹp nát đầu nổ lõm),
    // 2 gân đứng sau lưng, 6 tay chống ra bản mã bắt 2 bu-lông vào vỏ xe
    slat: () => batchGroup(b => {
      const W = 11, H = 8;
      for (const y of [-H / 2, H / 2]) { b.box(W, 0.42, 0.12, P, [0, y, 0]); b.box(W, 0.12, 0.62, P, [0, y, -0.26]); }
      for (const x of [-W / 2, W / 2]) { b.box(0.42, H, 0.12, P, [x, 0, 0]); b.box(0.12, H, 0.62, P, [x, 0, -0.26]); }
      for (let i = 1; i < 10; i++) b.box(W - 0.3, 0.1, 0.56, P, [0, -H / 2 + i * H / 10, -0.22]);
      for (const x of [-1.85, 1.85]) b.box(0.32, H, 0.1, P, [x, 0, -0.55]);
      for (const x of [-4.6, 0, 4.6]) for (const y of [-3.0, 3.0]) {
        b.box(0.26, 0.26, 2.3, D, [x, y, -1.75]);
        b.box(0.9, 0.9, 0.12, S, [x, y, -2.95]);
        for (const d of [-0.28, 0.28]) b.cyl(0.09, 0.09, 0.12, 6, S, [x + d, y + d, -3.03], 'z');
      }
    }),
    // giáp ốp composite: khối vát mép sơn xe, tấm thép đế lớn hơn phía sau, 6 bu-lông chìm trong lỗ khoét, 2 tai cẩu
    // trên mép, gioăng cao su viền, số lô in khuôn
    applique: () => {
      const top = 1.1 + 0.28;
      const g = batchGroup(b => {
        const geo = new THREE.ExtrudeGeometry(roundRect(9.2, 6.0, 0.4), { depth: 1.1, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.28, bevelSegments: 2, curveSegments: 4 });
        b.add(geo, P, [0, 0, 0]);
        b.box(10.2, 7.0, 0.3, D, [0, 0, -0.35]);
        b.box(9.9, 6.7, 0.18, VM.rubber || D, [0, 0, -0.12]);
        for (const x of [-3.6, 0, 3.6]) for (const y of [-2.1, 2.1]) {
          b.cyl(0.48, 0.48, 0.02, 20, D, [x, y, top + 0.005], 'z');
          b.cyl(0.3, 0.3, 0.14, 6, S, [x, y, top - 0.04], 'z');
        }

    camo: () => {

  // ô ĐỘNG CƠ: diesel V12 quân sự (nguyên bản) + bộ tăng áp / tăng áp kép + két làm mát khí nạp phun nước / tuabin khí
  // kiểu AGT-1500 có bộ thu hồi nhiệt / máy lai điện. Trục máy theo X, đầu máy (pu-li) ở -X, bánh đà ở +X.
  const ENG_TH = 0.55;   // nửa góc chữ V của 2 dãy xi-lanh
  // khung 1 dãy xi-lanh: gốc O ở mặt trên hộp trục khuỷu, trục 'u' dọc thân xi-lanh, 'n' pháp tuyến ra ngoài
  const bankFrame = (s, k) => {
    const c = Math.cos(ENG_TH), sn = Math.sin(ENG_TH);
    const O = [0, 2.5 * k, s * 0.5 * k], u = [0, c, s * sn], n = [0, -sn, s * c];
    return { rot: [s * ENG_TH, 0, 0], at: (x, du, dn) => [x, O[1] + u[1] * du * k + n[1] * dn * k, O[2] + u[2] * du * k + n[2] * dn * k] };

  // Khối diesel V: các-te gân tản nhiệt, hộp trục khuỷu, 2 dãy xi-lanh + nắp quy-lát có gân & bu-lông, cổ góp xả từng máy
  // (thép cháy màu đồng) gom về ống góp, cổ hút gió giữa chữ V, bơm cao áp + ống dầu đồng, đầu máy: nắp cam, pu-li, dây
  // đai, máy phát, bơm nước; đuôi máy: vỏ bánh đà + mặt bích hộp số; chân máy cao su
  const engBlock = (b, k = 1, cyl = 6) => {
    const L = 7.2 * k, x0 = -L / 2, pitch = (L - 0.8 * k) / cyl;
    b.box(L - 0.8 * k, 0.9 * k, 3.0 * k, MAT.black, [0, 0.45 * k, 0]);                                 // các-te dầu
    for (let i = 0; i < 7; i++) b.box(0.08 * k, 0.7 * k, 3.1 * k, MAT.iron, [x0 + 0.8 * k + i * (L - 1.6 * k) / 6, 0.45 * k, 0]);
    b.box(L, 1.7 * k, 3.8 * k, MAT.oliveDark, [0, 1.75 * k, 0]);                                     // hộp trục khuỷu

    for (const s of [-1, 1]) {
      const B = bankFrame(s, k);
      b.box(L - 0.2 * k, 2.0 * k, 1.9 * k, MAT.oliveDark, B.at(0, 1.0, 0), B.rot);                    // thân dãy xi-lanh
      b.box(L - 0.1 * k, 0.7 * k, 2.1 * k, MAT.olive, B.at(0, 2.35, 0), B.rot);                       // nắp máy (quy-lát)
      b.box(L - 0.6 * k, 0.5 * k, 1.6 * k, MAT.black, B.at(0, 2.95, 0), B.rot);                       // nắp dàn cò
      for (let i = 0; i < cyl; i++) {

        for (const dn of [-0.6, 0.6]) b.cyl(0.08 * k, 0.08 * k, 0.12 * k, 6, MAT.steel, B.at(x + pitch * 0.25, 3.25, dn), 'y', B.rot);
        b.strut(B.at(x, 2.2, 1.05), B.at(x + pitch * 0.15, 1.7, 1.75), 0.2 * k, MAT.copper, 8);       // cổ góp xả
        b.strut(B.at(x, 2.6, -0.6), [x, 4.4 * k, s * 0.25 * k], 0.07 * k, MAT.brass, 5);              // ống dầu cao áp
      }

    }
    b.box(L - 1.4 * k, 0.6 * k, 0.9 * k, MAT.alu, [0, 4.55 * k, 0]);                                  // cổ hút gió giữa chữ V
    b.box(1.6 * k, 0.7 * k, 0.8 * k, MAT.oliveDark, [x0 + 1.3 * k, 4.1 * k, 0]);                       // bơm cao áp
    // đầu máy
    b.box(0.5 * k, 3.6 * k, 3.6 * k, MAT.black, [x0 - 0.25 * k, 2.4 * k, 0]);                          // nắp bánh răng cam
    b.cyl(1.0 * k, 1.0 * k, 0.4 * k, 22, MAT.steel, [x0 - 0.75 * k, 1.3 * k, 0], 'x');                  // pu-li trục khuỷu
    b.cyl(0.6 * k, 0.6 * k, 0.35 * k, 18, MAT.steel, [x0 - 0.75 * k, 3.2 * k, 0], 'x');                 // bơm nước
    b.cyl(0.65 * k, 0.65 * k, 1.3 * k, 18, MAT.alu, [x0 - 0.2 * k, 3.6 * k, 1.9 * k], 'x');             // máy phát điện
    for (let i = 0; i < 6; i++) b.box(1.2 * k, 0.05, 0.12 * k, MAT.steel, [x0 - 0.2 * k, 3.6 * k + Math.sin(i) * 0.66 * k, 1.9 * k + Math.cos(i) * 0.66 * k], [i, 0, 0]);
    b.strut([x0 - 0.75 * k, 0.4 * k, 0.9 * k], [x0 - 0.75 * k, 3.7 * k, 1.5 * k], 0.12 * k, MAT.black, 6);   // dây đai
    b.strut([x0 - 0.75 * k, 0.4 * k, -0.9 * k], [x0 - 0.75 * k, 3.3 * k, -0.5 * k], 0.12 * k, MAT.black, 6);
    // đuôi máy
    b.cyl(1.7 * k, 2.0 * k, 1.1 * k, 24, MAT.oliveDark, [-x0 + 0.55 * k, 1.9 * k, 0], 'x');              // vỏ bánh đà
    b.cyl(2.1 * k, 2.1 * k, 0.2 * k, 24, MAT.steel, [-x0 + 1.2 * k, 1.9 * k, 0], 'x');                   // mặt bích hộp số
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; b.cyl(0.1 * k, 0.1 * k, 0.15 * k, 6, MAT.iron, [-x0 + 1.33 * k, 1.9 * k + Math.sin(a) * 1.85 * k, Math.cos(a) * 1.85 * k], 'x'); }
    for (const x of [-2.4, 2.4]) for (const s of [-1, 1]) {
      b.box(0.7 * k, 0.35 * k, 0.9 * k, MAT.steel, [x * k, 1.2 * k, s * 2.25 * k]);                   // chân máy
      b.cyl(0.32 * k, 0.32 * k, 0.4 * k, 10, MAT.black, [x * k, 0.8 * k, s * 2.25 * k]);              // đệm cao su
    }
    b.cyl(0.38 * k, 0.38 * k, 0.9 * k, 12, MAT.yellow, [1.6 * k, 1.0 * k, -2.25 * k], 'z');            // lọc dầu
    // tai cẩu máy 2 đầu, mô-tơ đề + rơ-le, 2 bầu lọc nhiên liệu, ống nước cao su có cổ dê từ bơm nước lên 2 nắp máy,
    // bó dây điện dọc 2 dãy có kẹp, que thăm dầu

    b.cyl(0.22 * k, 0.22 * k, 0.8 * k, 12, MAT.black, [-x0 - 0.4 * k, 1.55 * k, 2.15 * k], 'x');
    for (const dx of [0, 0.75]) {
      b.cyl(0.3 * k, 0.3 * k, 0.9 * k, 14, MAT.alu, [x0 + 2.4 * k + dx * k, 3.9 * k, -2.0 * k]);

      for (const c of [a0, a1]) b.cyl(0.2 * k, 0.2 * k, 0.12 * k, 12, MAT.steel, c, 'x');
      const B = bankFrame(sd, k);
      b.strut(B.at(x0 + 0.6 * k, 2.3, -1.15), B.at(-x0 - 0.6 * k, 2.3, -1.15), 0.07 * k, MAT.black, 6);
      for (let i = 0; i < 4; i++) b.box(0.1 * k, 0.16 * k, 0.16 * k, MAT.steel, B.at(x0 + (1.2 + i * 1.6) * k, 2.3, -1.15), B.rot);

  // Bộ tăng áp: vỏ ốc máy nén nhôm + vỏ tuabin xả (thép cháy đồng), ống vào / ra, tấm chắn nhiệt

    b.cyl(0.5 * r, 0.5 * r, 0.35 * r, 16, MAT.steel, [x, y, z], 'z');                                    // thân trục

    b.cyl(0.3 * r, 0.3 * r, 1.4 * r, 12, MAT.alu, [x + 0.9 * r, y + 0.5 * r, z - dir * 0.45 * r], 'x');  // ống khí nén ra

  const airFilter = (b, p, r = 1) => {

    for (const dx of [-0.6, 0.6]) b.box(0.25 * r, 0.9 * r, 1.4 * r, MAT.steel, [p[0] + dx * r, p[1] - 0.8 * r, p[2]]);   // đai kẹp

  const ENGINES = {

      const cx = -1.0, cy = 6.0;
      b.box(4.4, 1.6, 2.8, MAT.black, [cx, cy, 0]);                                                      // két làm mát khí nạp
      for (let i = 0; i < 16; i++) b.box(0.06, 1.5, 2.9, MAT.alu, [cx - 2.0 + i * 0.27, cy, 0]);
      for (const dx of [-2.35, 2.35]) b.box(0.4, 1.8, 3.0, MAT.alu, [cx + dx, cy, 0]);                    // hộp góp 2 đầu két
      b.strut([cx + 2.4, cy, 0], [2.5, 5.7, 0], 0.3, MAT.black, 10);
      b.cyl(0.6, 0.6, 1.8, 16, MAT.redPaint, [cx - 1.0, cy + 1.5, 0], 'x');                               // bình nước phun
      for (let i = 0; i < 4; i++) {
        const x = cx - 1.6 + i * 1.1;
        b.strut([cx - 1.0, cy + 1.2, 0.3], [x, cy + 0.95, 1.2], 0.07, MAT.redPaint, 5);
        b.cyl(0.12, 0.08, 0.3, 8, MAT.brass, [x, cy + 0.85, 1.25], 'y');                                  // béc phun
      }
    }, 0),
    // tuabin khí kiểu AGT-1500: miệng hút loe có lưới, tầng nén ghép vành bu-lông, buồng đốt, bộ thu hồi nhiệt gân tản
    // nhiệt lớn phía sau, hộp bánh răng phụ dưới bụng + bơm, ống xả cong
    turbine: () => batchGroup(b => {
      const y = 2.6;
      b.cyl(2.7, 2.1, 1.2, 28, MAT.alu, [-4.6, y, 0], 'x');                                              // miệng hút loe
      b.cyl(2.0, 2.0, 0.1, 28, MAT.black, [-5.22, y, 0], 'x');
      for (let i = 0; i < 6; i++) b.box(0.08, 3.9, 0.12, MAT.steel, [-5.25, y, 0], [i * Math.PI / 6, 0, 0]);   // lưới chắn
      b.cyl(0.5, 0.5, 0.3, 14, MAT.steel, [-5.3, y, 0], 'x');
      b.cyl(2.0, 2.2, 3.8, 28, MAT.alu, [-2.1, y, 0], 'x');                                              // tầng nén
      for (let i = 0; i < 4; i++) {
        const x = -3.6 + i * 1.05;
        b.cyl(2.3, 2.3, 0.2, 28, MAT.steel, [x, y, 0], 'x');                                              // vành ghép
        for (let j = 0; j < 12; j++) { const a = j / 12 * Math.PI * 2; b.cyl(0.07, 0.07, 0.26, 5, MAT.iron, [x, y + Math.sin(a) * 2.22, Math.cos(a) * 2.22], 'x'); }
      }
      b.cyl(2.3, 2.3, 1.6, 28, MAT.steel, [0.6, y, 0], 'x');                                              // buồng đốt
      b.cyl(0.35, 0.35, 1.6, 10, MAT.copper, [0.6, y + 2.4, 0]);                                         // bộ đánh lửa / ống nhiên liệu
      // bộ thu hồi nhiệt: khối lớn có lá tản nhiệt
      b.box(3.6, 4.6, 4.6, MAT.oliveDark, [3.4, 2.5, 0]);
      for (let i = 0; i < 14; i++) b.box(3.4, 4.4, 0.06, MAT.iron, [3.4, 2.5, -2.36 + i * 0.36 - 0.0]);
      for (const s of [-1, 1]) b.box(3.7, 0.3, 0.3, MAT.steel, [3.4, 4.85, s * 2.2]);
      // ống xả cong lên sau
      b.cyl(1.1, 1.3, 1.6, 20, MAT.copper, [4.0, 5.6, 0]);
      b.cyl(1.15, 1.15, 0.25, 20, MAT.steel, [4.0, 6.45, 0]);
      // hộp bánh răng phụ + bơm dầu / nhiên liệu, ống dẫn
      b.box(3.2, 1.2, 2.4, MAT.black, [-2.2, 0.6, 0]);
      for (const [x, z] of [[-3.2, 1.5], [-1.4, 1.5], [-2.3, -1.6]]) b.cyl(0.45, 0.45, 0.9, 14, MAT.alu, [x, 0.7, z], 'z');
      b.strut([-1.0, 0.9, 1.6], [0.6, 2.0, 2.3], 0.12, MAT.brass, 6);
      b.strut([-3.0, 1.0, -1.7], [2.0, 1.4, -2.4], 0.12, MAT.brass, 6);
      for (const x of [-2.6, 3.2]) b.box(0.6, 0.6, 5.2, MAT.steel, [x, 0.3, 0]);                          // khung đỡ
    }, 0),
    // máy lai điện: diesel V8 nhỏ + máy phát / mô-tơ có gân tản nhiệt, bộ biến tần lá nhôm, khối pin, cáp cao áp cam
    hybrid: () => batchGroup(b => {
      engBlock(b, 0.75, 4);
      const gx = 4.6;
      b.cyl(1.6, 1.6, 3.0, 24, MAT.steel, [gx, 1.5, 0], 'x');                                            // máy phát / mô-tơ
      for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; b.box(2.8, 0.25, 0.08, MAT.alu, [gx, 1.5 + Math.sin(a) * 1.68, Math.cos(a) * 1.68], [a, 0, 0]); }
      b.cyl(1.0, 1.0, 0.3, 20, MAT.black, [gx + 1.6, 1.5, 0], 'x');
      b.box(3.0, 1.4, 2.0, MAT.oliveDark, [gx, 3.9, 0]);                                                  // bộ biến tần
      for (let i = 0; i < 9; i++) b.box(0.06, 0.6, 2.0, MAT.alu, [gx - 1.3 + i * 0.32, 4.9, 0]);
      b.box(6.4, 1.5, 2.6, MAT.black, [0.4, 0.75, -3.6]);                                                  // khối pin
      for (let i = 0; i < 6; i++) b.box(0.9, 0.2, 2.3, MAT.oliveDark, [-2.3 + i * 1.08, 1.6, -3.6]);
      for (const dz of [-0.4, 0.4]) b.strut([gx - 1.0, 3.6, 1.0 + dz * 0.3], [0.4, 1.7, -2.4 + dz], 0.18, MAT.amber, 8);   // cáp cao áp
      b.strut([gx - 0.6, 3.4, -0.9], [gx + 0.4, 1.9, -1.4], 0.18, MAT.amber, 8);
    }, 0)
  };
  // nhìn từ đầu máy (pu-li, máy phát, bộ tăng áp) thay vì mặt bánh đà
  for (const id in ENGINES) ITEMS.push({ id, build: ENGINES[id], kind: 'module', rotY: Math.PI });
  // ô UAV lựu pháo: drone trinh sát quadcopter (mặc định) / UAV cảm tử cánh gập (ảnh vật tư UAV cảm tử)
  if (window.ReconDrone) ITEMS.push({ id: 'recon', build: () => { const g = ReconDrone.build('BLUE'); g.userData.pad = 0.98; return g; }, kind: 'module', rotY: 0.5 });
  if (window.KamiUAV) ITEMS.push({ id: 'uav_kami', build: () => { const g = KamiUAV.build('BLUE'); KamiUAV.animate(g, 1, 1, 0); g.userData.pad = 0.85; return g; }, kind: 'module', rotY: 2.7 });
  const AMMO = {
    ALL_ROUNDER: ['NORMAL', 'AP', 'HE'], GATLING: ['GATLING_BULLET', 'GATLING_HE', 'INCENDIARY'],
    ARTILLERY: ['NORMAL', 'HE', 'CLUSTER'], SCOUT: ['SCOUT_BULLET', 'INCENDIARY', 'RPG', 'ANTI_TANK_MISSILE']
  };
  for (const t in AMMO) for (const a of AMMO[t]) ITEMS.push({ id: 'ammo_' + t + '_' + a, build: () => ammoModel(t, a), kind: 'ammo' });
  const PREM = { ap_du: ['ALL_ROUNDER', 'AP'], heat_tandem: ['ALL_ROUNDER', 'NORMAL'], apds30: ['GATLING', 'GATLING_BULLET'], ahead30: ['GATLING', 'GATLING_BULLET'], slap127: ['SCOUT', 'SCOUT_BULLET'], mk211: ['SCOUT', 'SCOUT_BULLET'], he_frag: ['ARTILLERY', 'HE'] };
  for (const id in PREM) ITEMS.push({ id: 'prem_' + id, build: () => ammoModel(PREM[id][0], PREM[id][1], id), kind: 'ammo' });
  // tên lửa tấn công đỉnh (xe trinh sát): ống phóng kiểu Javelin bọc đệm cao su + khối ngắm nhiệt CLU, sơn có vết dùng
  // tên lửa tấn công đỉnh kiểu Javelin: ống phóng composite ô-liu có 2 vòng đệm giảm chấn cao su, nắp trước có quai kéo,
  // khối pin làm lạnh (BCU) ở đuôi, dây đeo; khối ngắm CLU gắn bên trái: kính vật ảnh nhiệt lớn + kính ngày nhỏ, 2 tay
  // nắm có nút bấm, chụp mắt cao su phía sau; chữ in khuôn trên ống
  ITEMS.push({ id: 'prem_topatk', kind: 'module', build: () => {
    const RM = VehicleKit.createMaterials('BLUE', { battle: 1 });
    const g = batchGroup(b => {
      const RB = RM.rubber || RM.dark, Y = 3;
      b.cyl(0.88, 0.88, 9.4, 22, AM.olive, [0, Y, 0], 'z');
      for (const z of [-4.3, 4.2]) b.cyl(1.12, 1.12, 1.1, 22, RB, [0, Y, z], 'z');
      for (const z of [-3.6, 3.5]) b.cyl(0.93, 0.93, 0.18, 22, AM.oliveD, [0, Y, z], 'z');
      b.cyl(1.0, 1.0, 0.2, 22, RB, [0, Y, -4.95], 'z');                                 // nắp trước
      b.strut([0, Y + 0.35, -5.08], [0, Y - 0.35, -5.08], 0.07, RM.canvasDark || RB, 6);
      b.cyl(0.5, 0.5, 0.9, 16, RM.dark, [-0.55, Y - 0.55, 4.9], 'z');                   // khối pin làm lạnh
      b.strut([0.9, Y - 0.1, -3.0], [0.9, Y - 0.1, 3.0], 0.05, RM.canvasDark || RB, 6);  // dây đeo
      // CLU
      const cx = 1.85, cy = 3.25, cz = -0.5;
      b.box(1.6, 1.5, 2.8, RM.paint, [cx, cy, cz]);
      b.box(1.7, 0.18, 2.9, RM.dark, [cx, cy + 0.8, cz]);
      b.cyl(0.55, 0.55, 0.35, 20, RM.dark, [cx, cy + 0.05, cz - 1.55], 'z');
      b.cyl(0.46, 0.46, 0.05, 20, RM.glass || RM.dark, [cx, cy + 0.05, cz - 1.74], 'z');
      b.cyl(0.2, 0.2, 0.3, 14, RM.dark, [cx + 0.45, cy + 0.55, cz - 1.5], 'z');
      b.cyl(0.15, 0.15, 0.04, 14, RM.glass || RM.dark, [cx + 0.45, cy + 0.55, cz - 1.66], 'z');
      b.cyl(0.32, 0.38, 0.45, 16, RB, [cx, cy + 0.2, cz + 1.6], 'z');                  // chụp mắt
      for (const sz of [-0.7, 0.6]) {
        b.box(0.32, 1.1, 0.4, RB, [cx + 0.95, cy - 0.2, cz + sz], [0, 0, -0.15]);         // tay nắm
        b.cyl(0.07, 0.07, 0.1, 8, RM.steel, [cx + 1.0, cy + 0.3, cz + sz], 'x');
      }
      b.box(0.9, 0.5, 0.06, RM.dark, [cx + 0.2, cy - 0.2, cz + 1.42]);                  // màn chỉnh / nắp pin
    }, 0);
    const lab = label(0.88, -2.4, 2.4, 1.3, 'rgba(0,0,0,0)', '#d9cf9c', ['MISSILE GUIDED', 'FGM-148F  LOT 9-22'], 1.0);
    lab.material.transparent = true;
    lab.material.map.needsUpdate = true;
    const wrap = new THREE.Group();
    wrap.rotation.x = -Math.PI / 2;
    wrap.position.set(0, 3, 0);
    wrap.add(lab);
    g.add(wrap);
    return g;
  } });

  const ONLY = new URLSearchParams(location.search).get('only');
  if (ONLY) { const keep = new Set(ONLY.split(',')); for (let i = ITEMS.length - 1; i >= 0; i--) if (!keep.has(ITEMS[i].id)) ITEMS.splice(i, 1); }

  // ===================== CHỤP =====================
  const box = new THREE.Box3(), sph = new THREE.Sphere(), v = new THREE.Vector3();
  const small = document.createElement('canvas');
  small.width = small.height = OUT;
  const sx = small.getContext('2d');
  sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = 'high';
  function shoot(item) {
    const holder = new THREE.Group();
    const obj = item.build();
    // vật liệu xe mang hộp trời của game -> bỏ để mọi món cùng phản chiếu phòng chụp (đồng bộ độ sáng giữa các ảnh)
    obj.traverse(o => {
      if (!o.material) return;
      for (const m of Array.isArray(o.material) ? o.material : [o.material]) if (m.envMap) { m.envMap = null; m.needsUpdate = true; }
    });
    holder.add(obj);
    if (item.kind === 'ammo') {
      // viên đạn nằm chéo: mũi hướng lên phải, hơi chĩa về phía người xem
      obj.rotation.set(0, 0, -0.95);
      holder.rotation.y = -0.35;
    } else {
      holder.rotation.y = -0.55 + (item.rotY || 0);   // rotY: món nhìn từ trước (mũi xe hướng -z)
    }
    scene.add(holder);
    holder.updateMatrixWorld(true);
    box.setFromObject(holder);
    box.getBoundingSphere(sph);
    holder.position.sub(sph.center);
    holder.position.y += sph.radius * 0.08;
    holder.updateMatrixWorld(true);
    box.setFromObject(holder);
    const R = item.fixR || sph.radius;
    catcher.position.set(0, box.min.y - 0.02, 0);
    catcher.scale.set(R * 6, R * 6, 1);
    key.position.set(-R * 2.2, R * 3.6, R * 2.6); key.target.position.set(0, 0, 0);
    const sc = key.shadow.camera; sc.left = sc.bottom = -R * 2.8; sc.right = sc.top = R * 2.8;   // đủ rộng để bóng kéo dài không bị cắt mép sc.near = 0.1; sc.far = R * 12; sc.updateProjectionMatrix();
    rim.position.set(R * 3, R * 1.5, -R * 3);
    fill.position.set(R * 2, -R * 0.5, R * 3);
    const dir = item.kind === 'ammo' ? v.set(0.15, 0.32, 1).normalize() : v.set(0.55, 0.62, 1).normalize();
    // khung sát vật: đạn nằm chéo ô vuông nên cho khít hơn
    const dist = R / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (item.kind === 'ammo' ? 0.8 : 0.9) * (obj.userData.pad || 1);
    camera.position.copy(dir).multiplyScalar(dist);
    camera.near = dist * 0.05; camera.far = dist * 4;
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    sx.clearRect(0, 0, OUT, OUT);
    sx.drawImage(renderer.domElement, 0, 0, OUT, OUT);
    scene.remove(holder);
    return small.toDataURL('image/webp', 0.9);
  }

  const grid = document.getElementById('grid');
  const urls = {};
  ITEMS.forEach(it => {
    try {
      const url = shoot(it);
      urls[it.id] = url;
      const f = document.createElement('figure');
      f.innerHTML = `<img data-id="${it.id}" src="${url}" alt=""><figcaption>${it.id}</figcaption>`;
      grid.appendChild(f);
    } catch (e) { console.error(it.id, e); document.title = 'ERR ' + it.id + ' ' + e.message; }
  });
  document.getElementById('status').textContent = `Đã dựng ${Object.keys(urls).length} ảnh`;
  if (!document.title.startsWith('ERR')) document.title = 'OK ' + Object.keys(urls).length;
  const dl = document.getElementById('dl');
  dl.disabled = false;
  dl.onclick = () => {
    for (const id in urls) { const a = document.createElement('a'); a.href = urls[id]; a.download = id + '.webp'; a.click(); }
  };
})();
</script>
</body>
</html>
