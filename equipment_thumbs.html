<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Render ảnh trang bị</title>
<!--
  TRANG RENDER ẢNH TRANG BỊ (chạy 1 lần khi đổi mô hình / thêm món):
  dựng mô hình 3D thật của từng món bằng chính vật liệu trong game (sơn xe, thép, cảm biến, lá ngụy trang,
  mô hình đạn ProjectileModels), chụp nền trong suốt góc 3/4 có đèn key + rim + bóng đổ, xuất WebP 256 px.
  Mở trang trong trình duyệt -> bấm "Tải tất cả" để lưu từng ảnh, hoặc chạy headless rồi tách các <img data-id>
  (dump-dom) ra assets/equipment/<id>.webp. Dải chọn trang bị (src/ui/armory_ui.js) đọc ảnh từ thư mục đó.
-->
<style>
  body { margin: 0; background: #11150f; color: #d8dccf; font: 13px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 10px; padding: 12px; }
  #grid figure { margin: 0; background: #1a2019; border: 1px solid #2d352a; text-align: center; padding: 6px; }
  #grid img { width: 128px; height: 128px; display: block; margin: 0 auto 4px; }
  #bar { padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  button { font: 600 12px system-ui; padding: 6px 10px; }
</style>
</head>
<body>
<div id="bar"><span id="status">Đang dựng…</span><button id="dl" disabled>Tải tất cả</button></div>
<div id="grid"></div>
<script src="three.min.js?v=20261019i"></script>
<script src="src/core/sky.js?v=20261020tone1"></script>
<script src="src/core/equipment.js?v=20261021eqr1"></script>
<script src="src/entities/projectiles.js?v=20261019trc1"></script>
<script src="src/entities/tanks/vehicle_kit.js?v=20261020fine1"></script>
<script>
(function () {
  const OUT = 256, RS = 512;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(RS, RS);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.LinearEncoding;
  if (window.SkySystem && SkySystem.installToneCurve) SkySystem.installToneCurve(renderer, 1.1);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xe2ecf6, 0x3a3226, 0.55));
  scene.add(new THREE.AmbientLight(0xffffff, 0.16));
  const key = new THREE.DirectionalLight(0xfff3e0, 1.35);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.bias = -0.0004;
  scene.add(key, key.target);
  const rim = new THREE.DirectionalLight(0xbfdcff, 0.7);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.22);
  scene.add(fill);
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 2000);
  // mặt hứng bóng (chỉ vẽ bóng, nền vẫn trong suốt)
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.32 }));
  catcher.rotation.x = -Math.PI / 2;
  catcher.receiveShadow = true;
  scene.add(catcher);

  const K = VehicleKit, EQ = Equipment;
  const VM = K.createMaterials('BLUE');
  const KM = EQ.kitMats('BLUE');
  const std = (c, r, m, extra) => Object.assign(new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m }), extra || {});
  const MAT = {
    olive: std(0x4b5232, 0.55, 0.25), oliveDark: std(0x353a24, 0.6, 0.2), steel: std(0x8e9194, 0.32, 0.85),
    black: std(0x1b1c1d, 0.6, 0.3), brass: std(0xd2ab55, 0.3, 0.6), brassD: std(0x9c7a35, 0.38, 0.6),
    red: std(0x9a1d16, 0.5, 0.1), redPaint: std(0xa3241b, 0.42, 0.2), copper: std(0xc0784a, 0.3, 0.6),
    tung: std(0x7d8389, 0.35, 0.85), amber: std(0xc4862f, 0.45, 0.1), sabot: std(0x5c6247, 0.5, 0.4),
    yellow: std(0xd6ad2b, 0.5, 0.1), white: std(0xe6e2d4, 0.5, 0.1), alu: std(0xb9bdc1, 0.35, 0.8),
    fabric: std(0x8c7d4a, 0.95, 0), iron: std(0x5a5650, 0.55, 0.6)
  };
  if (VM.canvas && VM.canvas.map) MAT.fabric.map = VM.canvas.map;
  // phản chiếu bầu trời cho kim loại (cùng envMap với thép xe, nếu có)
  const ENV = (VM.steel && VM.steel.envMap) || null;
  if (ENV) for (const k of ['brass', 'brassD', 'copper', 'steel', 'tung', 'alu', 'iron', 'redPaint']) { MAT[k].envMap = ENV; MAT[k].envMapIntensity = 0.9; }

  const lathe = (pts, seg = 28) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(Math.max(0.001, p[0]), p[1])), seg);
  const meshOf = (geo, mat, pos, rot, sc) => {
    const m = new THREE.Mesh(geo, mat);
    if (pos) m.position.set(pos[0], pos[1], pos[2]);
    if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    if (sc) m.scale.set(sc[0], sc[1], sc[2]);
    m.castShadow = m.receiveShadow = true;
    return m;
  };
  function stripTracers(g) {
    const kill = [];
    g.traverse(o => { if (o.userData && o.userData.tracer) kill.push(o); });
    kill.forEach(o => o.parent.remove(o));
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    return g;
  }

  // ===================== ĐẠN =====================
  // Vỏ đạn đồng thau cho đạn nhỏ (trục +Y, đáy ở y0, dài len, bán kính r, cổ thu về rn)
  function casing(r, rn, len, y0) {
    const g = new THREE.Group();
    g.add(meshOf(lathe([[0, y0], [r * 1.08, y0], [r * 1.08, y0 + len * 0.04], [r * 0.92, y0 + len * 0.06], [r * 0.95, y0 + len * 0.1],
      [r, y0 + len * 0.12], [r, y0 + len * 0.78], [rn, y0 + len * 0.9], [rn, y0 + len], [0, y0 + len]]), MAT.brass));
    g.add(meshOf(new THREE.CylinderGeometry(r * 0.32, r * 0.32, 0.02, 16), MAT.brassD, [0, y0 - 0.005, 0]));
    return g;
  }
  // Đạn nhỏ hoàn chỉnh (đầu đạn + vỏ đồng thau): cal = '30' | '127'; type = 'std' | 'inc' | 'apds30' | 'slap127'
  function smallRoundModel(cal, type) {
    const g = new THREE.Group();
    const scout = cal === '127';
    const r = scout ? 0.32 : 0.42, L = scout ? 2.4 : 3.2;
    const caseLen = L * (scout ? 1.9 : 1.7), caseY = -L / 2 - L * (scout ? 1.7 : 1.5);
    if (type === 'apds30' || type === 'slap127') {
      // đạn xuyên dưới cỡ: guốc đạn + kim xuyên vonfram
      g.add(meshOf(lathe([[0, -L / 2], [r, -L / 2], [r, 0.15 * L], [r * 0.7, 0.3 * L], [0.001, 0.3 * L]]), type === 'apds30' ? MAT.black : MAT.amber));
      g.add(meshOf(new THREE.CylinderGeometry(r * 0.38, r * 0.38, L * 0.55, 16), MAT.tung, [0, L * 0.38, 0]));
      g.add(meshOf(new THREE.ConeGeometry(r * 0.38, L * 0.25, 16), MAT.tung, [0, L * 0.78, 0]));
    } else {
      const p = stripTracers(ProjectileModels.create(!scout && type === 'inc' ? 'INCENDIARY' : (scout ? 'SCOUT_BULLET' : 'GATLING_BULLET'), { scale: 1, tracer: false }));
      const isYellow = (o) => o.isMesh && o.material && o.material.color && o.material.color.getHex() === 0xd6ad2b;
      if (scout) p.traverse(o => { if (isYellow(o)) o.material = MAT.copper; });   // đầu đạn 12.7 bọc đồng
      else if (type === 'std') {
        // 30mm nổ mảnh: thân ô-liu, vạch vàng, ngòi đỏ
        p.traverse(o => { if (isYellow(o)) o.material = MAT.olive; });
        g.add(meshOf(new THREE.CylinderGeometry(r * 1.01, r * 1.01, L * 0.07, 22, 1, true), MAT.yellow, [0, L * 0.05, 0]));
        g.add(meshOf(new THREE.ConeGeometry(r * 0.32, L * 0.12, 16), MAT.red, [0, L * 0.43, 0]));
      }
      if (scout && type === 'inc') g.add(meshOf(new THREE.ConeGeometry(r * 0.62, L * 0.28, 16), MAT.red, [0, L * 0.36, 0]));
      g.add(p);
    }
    g.add(casing(r * 1.22, r * 1.02, caseLen, caseY));
    return g;
  }
  function rpgModel() {
    const g = new THREE.Group();
    g.add(meshOf(lathe([[0, 2.2], [0.5, 2.2], [1.15, 3.2], [1.35, 4.6], [1.2, 5.6], [0.55, 6.6], [0.2, 7.1], [0.001, 7.2]]), MAT.olive));
    g.add(meshOf(new THREE.CylinderGeometry(0.1, 0.14, 0.9, 10), MAT.steel, [0, 7.5, 0]));
    g.add(meshOf(new THREE.CylinderGeometry(0.42, 0.42, 5.2, 18), MAT.oliveDark, [0, -0.4, 0]));
    g.add(meshOf(new THREE.CylinderGeometry(1.36, 1.36, 0.25, 26, 1, true), MAT.yellow, [0, 4.1, 0]));
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      const fin = new THREE.BoxGeometry(0.05, 1.8, 0.9); fin.translate(0, 0, 0.7);
      g.add(meshOf(fin, MAT.alu, [0, -2.6, 0], [0, a, 0]));
    }
    g.add(meshOf(new THREE.CylinderGeometry(0.46, 0.36, 0.6, 16, 1, true), MAT.black, [0, -3.2, 0]));
    return g;
  }
  function ammoModel(tank, ammo, variant) {
    if (ammo === 'GATLING_BULLET' || ammo === 'SCOUT_BULLET' || ammo === 'INCENDIARY') {
      const cal = tank === 'SCOUT' ? '127' : '30';
      return smallRoundModel(cal, variant === 'apds30' || variant === 'slap127' ? variant : (ammo === 'INCENDIARY' ? 'inc' : 'std'));
    }
    if (ammo === 'RPG') return rpgModel();
    const heavy = tank === 'ARTILLERY';
    const g = new THREE.Group();
    const p = stripTracers(ProjectileModels.create(ammo, { scale: 1, heavy }));
    g.add(p);
    if (variant === 'ap_du') {
      // guốc đạn 3 cánh ô-liu ôm thân mũi tên (viên đạn nguyên chưa bắn)
      g.add(meshOf(new THREE.CylinderGeometry(0.75, 1.1, 2.8, 24), MAT.sabot, [0, 0.9, 0]));
    }
    if (variant === 'heat_tandem') {
      g.add(meshOf(new THREE.CylinderGeometry(1.01, 1.01, 0.4, 22, 1, true), MAT.red, [0, 0.2, 0]));
      g.add(meshOf(new THREE.CylinderGeometry(0.08, 0.12, 2.0, 10), MAT.steel, [0, 5.9, 0]));
      g.add(meshOf(new THREE.ConeGeometry(0.22, 0.5, 12), MAT.red, [0, 7.0, 0]));
    }
    if (variant === 'he_frag') {
      for (let i = 0; i < 7; i++) g.add(meshOf(new THREE.CylinderGeometry(1.305, 1.305, 0.12, 24, 1, true), MAT.oliveDark, [0, -3.6 + i * 0.75, 0]));
    }
    return g;
  }

  // ===================== GIÁP & PHỤ KIỆN =====================
  // Dựng bằng PartBatch + vật liệu xe (sơn ngụy trang có mòn mép, bụi; thép; cảm biến) như phụ kiện lắp trên xe
  function batchGroup(fill, yBase = 14) {
    const g = new THREE.Group();
    const b = new K.PartBatch(yBase);
    fill(b);
    b.build(g, null, { castShadow: true });
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    return g;
  }
  const P = VM.paint, D = VM.dark, S = VM.steel;
  const MODULE_BUILD = {
    era: () => batchGroup(b => {
      b.box(11, 7.4, 0.5, D, [0, 0, -0.35]);
      for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
        const x = -3.5 + c * 3.5, y = -1.8 + r * 3.6;
        b.box(3.2, 3.3, 1.0, P, [x, y, 0.4]);
        for (const dx of [-1.2, 1.2]) for (const dy of [-1.2, 1.2]) b.cyl(0.16, 0.16, 0.2, 6, D, [x + dx, y + dy, 0.95], 'z');
      }
    }),
    slat: () => batchGroup(b => {
      for (const x of [-5, -1.7, 1.7, 5]) b.box(0.4, 8, 0.4, S, [x, 0, 0]);
      for (let i = 0; i < 7; i++) b.box(10.8, 0.55, 0.18, D, [0, -3.4 + i * 1.13, 0.3]);
      for (const x of [-5, 5]) for (const y of [-3.2, 3.2]) b.box(0.5, 0.5, 2.2, S, [x, y, -1.1]);
    }),
    applique: () => batchGroup(b => {
      for (let i = 0; i < 3; i++) b.box(9.6 - i * 0.6, 6.4 - i * 0.4, 0.75, i === 2 ? P : D, [0, 0, i * 0.78]);
      for (const x of [-3.5, 0, 3.5]) for (const y of [-2, 2]) b.cyl(0.32, 0.32, 0.35, 6, S, [x, y, 1.8], 'z');
      b.box(9.2, 0.08, 0.1, D, [0, 0, 1.95]);
    }),
    spall: () => {
      const g = new THREE.Group();
      g.add(meshOf(new THREE.BoxGeometry(9, 0.25, 6.4), MAT.fabric, [0.6, 0, 0]));
      g.add(meshOf(new THREE.CylinderGeometry(1.25, 1.25, 6.6, 28), MAT.fabric, [-4.6, 1.1, 0], [Math.PI / 2, 0, 0]));
      g.add(meshOf(new THREE.CylinderGeometry(0.5, 0.5, 6.7, 18), MAT.oliveDark, [-4.6, 1.1, 0], [Math.PI / 2, 0, 0]));
      // đường may chần ô
      for (let i = 0; i < 4; i++) g.add(meshOf(new THREE.BoxGeometry(0.06, 0.28, 6.4), MAT.oliveDark, [-2.4 + i * 2.2, 0.01, 0]));
      for (let i = 0; i < 3; i++) g.add(meshOf(new THREE.BoxGeometry(8.6, 0.28, 0.06), MAT.oliveDark, [0.8, 0.01, -2.1 + i * 2.1]));
      g.rotation.x = 0.35;
      return g;
    },
    aps: () => batchGroup(b => {
      b.box(7.6, 0.6, 5.4, D, [0, 0, 0]);
      for (const s of [-1, 1]) {
        b.box(2.8, 2.4, 1.0, KM.sensor, [s * 2.2, 1.5, -1.6], [0, s * 0.45, 0]);
        b.box(2.4, 0.16, 0.9, S, [s * 2.2, 2.75, -1.6], [0, s * 0.45, 0]);
      }
      b.box(4.4, 1.4, 2.6, P, [0, 1.0, 1.4]);
      for (const x of [-1.2, 0, 1.2]) b.cyl(0.42, 0.42, 1.8, 12, D, [x, 1.6, 2.2], 'z', [0.4, 0, 0]);
      b.add(new THREE.SphereGeometry(0.9, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), KM.sensor, [0, 1.7, -0.2]);
    }),
    smoke: () => batchGroup(b => {
      b.box(6.6, 0.6, 3.2, P, [0, 0, 0]);
      b.box(6.6, 2.4, 0.5, P, [0, 1.2, -1.4]);
      for (let i = 0; i < 4; i++) {
        const x = -2.4 + i * 1.6;
        b.cyl(0.62, 0.62, 2.8, 14, D, [x, 1.9, 0.2], 'y', [0.6, 0, 0]);
        b.cyl(0.66, 0.66, 0.25, 14, S, [x, 2.95, 0.95], 'y', [0.6, 0, 0]);
      }
    }),
    camo: () => {
      const L = EQ.foliageMats('green');
      const g = new THREE.Group();
      const net = new THREE.Mesh(new THREE.PlaneGeometry(13, 9, 8, 6), new THREE.MeshStandardMaterial({ color: 0x2f3826, roughness: 1, side: THREE.DoubleSide }));
      const pa = net.geometry.attributes.position;
      for (let i = 0; i < pa.count; i++) { const x = pa.getX(i), y = pa.getY(i); pa.setZ(i, Math.cos(x * 0.4) * Math.cos(y * 0.5) * 1.6); }
      net.geometry.computeVertexNormals();
      net.rotation.x = -Math.PI / 2; net.receiveShadow = true;
      g.add(net);
      let s = 3;
      const R = () => (s = (s * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 16; i++) {
        const c = new THREE.Mesh(EQ.foliageClump(), L.leaf);
        c.position.set((R() - 0.5) * 10, 1 + R() * 1.6, (R() - 0.5) * 6.5);
        const k = 1.8 + R() * 1.4; c.scale.set(k, k * 0.7, k);
        c.rotation.y = R() * 6.3; c.castShadow = true;
        g.add(c);
      }
      for (let i = 0; i < 6; i++) {
        const t = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.09, 3.2, 5), L.twig);
        t.position.set((R() - 0.5) * 8, 3.2, (R() - 0.5) * 5); t.rotation.set((R() - 0.5) * 0.8, 0, (R() - 0.5) * 0.8);
        g.add(t);
      }
      return g;
    },
    fireext: () => {
      const g = new THREE.Group();
      g.add(meshOf(lathe([[0, 0], [1.2, 0], [1.25, 0.2], [1.25, 5.2], [1.0, 5.9], [0.45, 6.2], [0.001, 6.25]], 32), MAT.redPaint));
      g.add(meshOf(new THREE.CylinderGeometry(0.4, 0.45, 0.8, 14), MAT.brass, [0, 6.6, 0]));
      g.add(meshOf(new THREE.BoxGeometry(1.6, 0.35, 0.5), MAT.steel, [0.5, 7.1, 0], [0, 0, -0.15]));
      const gauge = meshOf(new THREE.CylinderGeometry(0.42, 0.42, 0.2, 18), MAT.white, [-0.55, 6.7, 0.3], [Math.PI / 2, 0, 0]);
      g.add(gauge);
      g.add(meshOf(new THREE.TorusGeometry(1.1, 0.13, 8, 24, Math.PI * 1.2), MAT.black, [1.1, 5.6, 0], [0, 0, -1.2]));
      g.add(meshOf(new THREE.CylinderGeometry(0.2, 0.28, 0.9, 10), MAT.black, [2.0, 4.6, 0]));
      for (const y of [1.4, 4.2]) g.add(meshOf(new THREE.CylinderGeometry(1.3, 1.3, 0.35, 32, 1, true), MAT.iron, [0, y, 0]));
      g.add(meshOf(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 16, 1, false), MAT.white, [0, 2.9, 1.23], [Math.PI / 2, 0, 0], [1, 0.05, 1]));
      return g;
    },
    turbo: () => {
      const g = new THREE.Group();
      g.add(meshOf(new THREE.TorusGeometry(1.9, 1.0, 16, 32), MAT.alu, [0, 0, 1.3]));
      g.add(meshOf(new THREE.CylinderGeometry(1.3, 1.5, 1.4, 28), MAT.alu, [0, 0, 1.3], [Math.PI / 2, 0, 0]));
      g.add(meshOf(new THREE.CylinderGeometry(1.05, 1.05, 2.4, 24, 1, true), MAT.alu, [0, 0, 2.8], [Math.PI / 2, 0, 0]));
      g.add(meshOf(new THREE.CylinderGeometry(0.85, 0.85, 1.6, 20), MAT.steel, [0, 0, -0.4], [Math.PI / 2, 0, 0]));
      g.add(meshOf(new THREE.TorusGeometry(1.7, 0.95, 16, 32), MAT.iron, [0, 0, -2.0]));
      g.add(meshOf(new THREE.CylinderGeometry(0.75, 0.75, 2.6, 18), MAT.iron, [2.6, 0, -2.0], [0, 0, Math.PI / 2]));
      g.add(meshOf(new THREE.CylinderGeometry(0.7, 0.7, 2.2, 18), MAT.alu, [-2.5, 0.8, 1.3], [0, 0, Math.PI / 2.4]));
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        g.add(meshOf(new THREE.BoxGeometry(0.08, 0.7, 0.9), MAT.steel, [Math.cos(a) * 0.65, Math.sin(a) * 0.65, 3.6], [0, 0, a]));
      }
      g.rotation.y = 0.5;
      return g;
    },
    radar: () => batchGroup(b => {
      b.box(2.4, 0.6, 2.4, S, [0, 0.3, 0]);
      b.cyl(0.36, 0.48, 5.2, 10, S, [0, 3.2, 0]);
      b.box(5.4, 2.2, 0.45, KM.sensor, [0, 6.6, 0], [0, 0.35, 0]);
      b.box(5.7, 0.22, 0.8, S, [0, 5.4, 0], [0, 0.35, 0]);
      b.cyl(0.42, 0.42, 0.6, 10, S, [0, 5.8, 0]);
    }),
    jammer: () => batchGroup(b => {
      b.box(4.2, 2.2, 3.2, KM.sensor, [0, 1.1, 0]);
      b.box(4.6, 0.22, 3.6, S, [0, 2.3, 0]);
      for (let i = 0; i < 4; i++) b.box(0.15, 1.6, 2.8, S, [-1.5 + i * 1.0, 1.1, 1.68], [0, Math.PI / 2, 0]);
      for (const k of [-1.3, 0, 1.3]) b.strut([k, 2.3, 0], [k * 1.8, 6.6, 0.5], 0.13, S, 6, 0.06);
      b.cyl(0.3, 0.3, 0.6, 10, KM.sensor, [1.5, 2.7, -1.0]);
    })
  };

  // ===================== DANH SÁCH ẢNH =====================
  const ITEMS = [];
  for (const id in MODULE_BUILD) ITEMS.push({ id, build: MODULE_BUILD[id], kind: 'module' });
  const AMMO = {
    ALL_ROUNDER: ['NORMAL', 'AP', 'HE'], GATLING: ['GATLING_BULLET', 'INCENDIARY'],
    ARTILLERY: ['NORMAL', 'HE', 'CLUSTER'], SCOUT: ['SCOUT_BULLET', 'INCENDIARY', 'RPG', 'ANTI_TANK_MISSILE']
  };
  for (const t in AMMO) for (const a of AMMO[t]) ITEMS.push({ id: 'ammo_' + t + '_' + a, build: () => ammoModel(t, a), kind: 'ammo' });
  const PREM = { ap_du: ['ALL_ROUNDER', 'AP'], heat_tandem: ['ALL_ROUNDER', 'NORMAL'], apds30: ['GATLING', 'GATLING_BULLET'], slap127: ['SCOUT', 'SCOUT_BULLET'], he_frag: ['ARTILLERY', 'HE'] };
  for (const id in PREM) ITEMS.push({ id: 'prem_' + id, build: () => ammoModel(PREM[id][0], PREM[id][1], id), kind: 'ammo' });

  // ===================== CHỤP =====================
  const box = new THREE.Box3(), sph = new THREE.Sphere(), v = new THREE.Vector3();
  const small = document.createElement('canvas');
  small.width = small.height = OUT;
  const sx = small.getContext('2d');
  sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = 'high';
  function shoot(item) {
    const holder = new THREE.Group();
    const obj = item.build();
    holder.add(obj);
    if (item.kind === 'ammo') {
      // viên đạn nằm chéo: mũi hướng lên phải, hơi chĩa về phía người xem
      obj.rotation.set(0, 0, -0.95);
      holder.rotation.y = -0.35;
    } else {
      holder.rotation.y = -0.55;
    }
    scene.add(holder);
    holder.updateMatrixWorld(true);
    box.setFromObject(holder);
    box.getBoundingSphere(sph);
    holder.position.sub(sph.center);
    holder.position.y += sph.radius * 0.08;
    holder.updateMatrixWorld(true);
    box.setFromObject(holder);
    const R = sph.radius;
    catcher.position.set(0, box.min.y - 0.02, 0);
    catcher.scale.set(R * 6, R * 6, 1);
    key.position.set(-R * 2.2, R * 3.6, R * 2.6); key.target.position.set(0, 0, 0);
    const sc = key.shadow.camera; sc.left = sc.bottom = -R * 1.6; sc.right = sc.top = R * 1.6; sc.near = 0.1; sc.far = R * 12; sc.updateProjectionMatrix();
    rim.position.set(R * 3, R * 1.5, -R * 3);
    fill.position.set(R * 2, -R * 0.5, R * 3);
    const dir = item.kind === 'ammo' ? v.set(0.15, 0.32, 1).normalize() : v.set(0.55, 0.62, 1).normalize();
    // khung sát vật: đạn nằm chéo ô vuông nên cho khít hơn
    const dist = R / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (item.kind === 'ammo' ? 0.8 : 0.9);
    camera.position.copy(dir).multiplyScalar(dist);
    camera.near = dist * 0.05; camera.far = dist * 4;
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    sx.clearRect(0, 0, OUT, OUT);
    sx.drawImage(renderer.domElement, 0, 0, OUT, OUT);
    scene.remove(holder);
    return small.toDataURL('image/webp', 0.9);
  }

  const grid = document.getElementById('grid');
  const urls = {};
  ITEMS.forEach(it => {
    try {
      const url = shoot(it);
      urls[it.id] = url;
      const f = document.createElement('figure');
      f.innerHTML = `<img data-id="${it.id}" src="${url}" alt=""><figcaption>${it.id}</figcaption>`;
      grid.appendChild(f);
    } catch (e) { console.error(it.id, e); document.title = 'ERR ' + it.id + ' ' + e.message; }
  });
  document.getElementById('status').textContent = `Đã dựng ${Object.keys(urls).length} ảnh`;
  if (!document.title.startsWith('ERR')) document.title = 'OK ' + Object.keys(urls).length;
  const dl = document.getElementById('dl');
  dl.disabled = false;
  dl.onclick = () => {
    for (const id in urls) { const a = document.createElement('a'); a.href = urls[id]; a.download = id + '.webp'; a.click(); }
  };
})();
</script>
</body>
</html>
